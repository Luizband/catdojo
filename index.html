<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatDojo - Entrada</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a4231">
    <style>
        /* RESET BÁSICO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        /* CONTAINER PRINCIPAL COM O FUNDO */
        #app {
            width: 100%;
            max-width: 414px;
            height: 100%;
            position: relative;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center; 
            justify-content: center;
            
            background-image: url('imagens/fundo.png');
            background-size: cover;
            background-position: center;
        }

        /* Filtro preto opaco de 45% */
        #app::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.45); 
            z-index: 1;
        }

        /* PAINEL DE PERGAMINHO */
        .painel-login {
            position: relative;
            z-index: 2;
            width: 85%;
            background-color: #f1ddb0; 
            border: 3px solid #5a4231;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.5), inset 0px 0px 20px rgba(139, 90, 43, 0.15);
        }

        /* LOGO (Metade do tamanho) */
        .logo-titulo {
            margin-bottom: 25px;
        }

        .logo-titulo img {
            width: 100%;
            max-width: 110px; 
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
        }

        /* CAMPOS DE TEXTO (Inputs) */
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #fdf5e6; 
            border: 2px solid #a68a61;
            border-radius: 6px;
            font-size: 1em;
            color: #2a2a2a;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input::placeholder {
            color: #bfa580;
        }

        input:focus {
            border-color: #5a4231;
        }

        /* CHECKBOX GRAVAR E-MAIL */
        .lembrar-email {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            margin-top: -5px; 
            text-align: left;
            color: #2a2a2a;
            font-weight: bold;
            font-size: 0.9em;
        }

        .lembrar-email input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #5a4231; 
        }

        .lembrar-email label {
            cursor: pointer;
        }

        /* BOTÕES ESTILO PERGAMINHO / MADEIRA */
        .btn-pergaminho {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background-color: #dfc495;
            color: #2a2a2a;
            font-size: 1.1em;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #5a4231;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0px 4px 0px #5a4231;
            transition: all 0.1s;
        }

        .btn-pergaminho:active {
            box-shadow: 0px 0px 0px #5a4231;
            transform: translateY(4px);
        }

        /* Estilo Secundário Dinâmico */
        .btn-pergaminho.btn-secundario {
            background-color: transparent;
            border: 2px dashed #a68a61;
            box-shadow: none;
            color: #5a4231;
            margin-top: 15px;
        }

        .btn-pergaminho.btn-secundario:active {
            transform: scale(0.98);
        }

        .divisor {
            margin: 20px 0;
            height: 2px;
            background-color: #a68a61;
            position: relative;
        }

        .divisor span {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f1ddb0;
            padding: 0 10px;
            color: #a68a61;
            font-size: 0.9em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="painel-login">
            
            <div class="logo-titulo">
                <img src="imagens/logo.png" alt="Logo CatDojo">
            </div>
            
            <div id="grupoRegistro" style="display: none;">
                <input type="text" id="nomeMestre" placeholder="Nome do Mestre (Máx 10 car.)" maxlength="10">
                <input type="text" id="nomeCla" placeholder="Nome do Clã (Máx 10 car.)" maxlength="10">
            </div>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">
            
            <div class="lembrar-email">
                <input type="checkbox" id="lembrarEmail">
                <label for="lembrarEmail">Gravar e-mail</label>
            </div>
            
            <button class="btn-pergaminho" id="btnLogin">Entrar no Dojo</button>
            
            <div class="divisor">
                <span>OU</span>
            </div>
            
            <button class="btn-pergaminho btn-secundario" id="btnRegistro">Fundar Novo Clã</button>

        </div>
    </div>

    <script type="module">
        import { auth, db, createUserWithEmailAndPassword, signInWithEmailAndPassword, doc, setDoc } from './firebase-config.js';
        import { gerarGatoInicial } from './gerador-gatos.js';

        const grupoRegistro = document.getElementById('grupoRegistro');
        const nomeMestreInput = document.getElementById('nomeMestre');
        const nomeClaInput = document.getElementById('nomeCla');
        const emailInput = document.getElementById('email');
        const senhaInput = document.getElementById('senha');
        const btnLogin = document.getElementById('btnLogin');
        const btnRegistro = document.getElementById('btnRegistro');
        const divisor = document.querySelector('.divisor');
        const checkLembrar = document.getElementById('lembrarEmail');
        const grupoLembrar = document.querySelector('.lembrar-email');

        let modoRegistro = false;

        // Carrega o e-mail memorizado
        if (localStorage.getItem('catdojo_email')) {
            emailInput.value = localStorage.getItem('catdojo_email');
            checkLembrar.checked = true;
        }

        // BOTÃO SUPERIOR (LOGIN / VOLTAR)
        btnLogin.addEventListener('click', async () => {
            if (modoRegistro) {
                modoRegistro = false;
                grupoRegistro.style.display = 'none';
                divisor.style.display = 'block';
                grupoLembrar.style.display = 'flex';
                
                btnLogin.textContent = "Entrar no Dojo";
                btnLogin.classList.remove('btn-secundario');
                
                btnRegistro.textContent = "Fundar Novo Clã";
                btnRegistro.classList.add('btn-secundario');
                return;
            }

            const email = emailInput.value;
            const senha = senhaInput.value;

            if (!email || !senha) {
                alert("Preencha o e-mail e a senha para entrar!");
                return;
            }

            btnLogin.textContent = "Entrando...";

            try {
                await signInWithEmailAndPassword(auth, email, senha);
                
                if (checkLembrar.checked) {
                    localStorage.setItem('catdojo_email', email);
                } else {
                    localStorage.removeItem('catdojo_email');
                }

                window.location.href = "dojo.html";
            } catch (error) {
                console.error(error);
                alert("Erro ao entrar. Verifique o e-mail e a senha.");
                btnLogin.textContent = "Entrar no Dojo";
            }
        });

        // BOTÃO INFERIOR (ABRIR CAMPOS / CONFIRMAR CRIAÇÃO)
        btnRegistro.addEventListener('click', async () => {
            if (!modoRegistro) {
                modoRegistro = true;
                grupoRegistro.style.display = 'block';
                divisor.style.display = 'none';
                grupoLembrar.style.display = 'none';
                
                btnLogin.textContent = "Voltar para o Login";
                btnLogin.classList.add('btn-secundario');
                
                btnRegistro.textContent = "Fundar Clã Agora!";
                btnRegistro.classList.remove('btn-secundario');
                return;
            }

            const nomeMestre = nomeMestreInput.value.trim();
            const nomeCla = nomeClaInput.value.trim();
            const email = emailInput.value;
            const senha = senhaInput.value;

            if (!nomeMestre || !nomeCla || !email || !senha) {
                alert("Preencha todos os campos para fundar o seu clã!");
                return;
            }

            if (senha.length < 6) {
                alert("A senha precisa ter no mínimo 6 caracteres!");
                return;
            }

            btnRegistro.textContent = "Fundando...";

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
                const user = userCredential.user;

                // 1. Cria a ficha do Clã
                await setDoc(doc(db, "Clas", user.uid), {
                    nomeMestre: nomeMestre,
                    nomeCla: nomeCla,
                    moedas: 50,
                    reputacao: 0,
                    dataCriacao: new Date().toISOString()
                });

                // 2. Gera os dois gatinhos iniciais a partir do módulo externo
                const gato1 = gerarGatoInicial();
                const gato2 = gerarGatoInicial();

                // 3. Salva os gatos criados na subcoleção interna do jogador
                await setDoc(doc(db, "Clas", user.uid, "Gatos", gato1.id), gato1);
                await setDoc(doc(db, "Clas", user.uid, "Gatos", gato2.id), gato2);

                alert("Clã fundado com sucesso! Os teus dois primeiros gatos já te esperam no Dormitório. Bem-vindo ao CatDojo.");
                window.location.href = "dojo.html";
            } catch (error) {
                console.error(error);
                alert("Erro ao criar conta. O e-mail pode já estar em uso.");
                btnRegistro.textContent = "Fundar Clã Agora!";
            }
        });

        // Ativa o instalador do PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA configurado com sucesso!'))
                    .catch(err => console.error('Erro ao configurar PWA:', err));
            });
        }
    </script>
</body>
</html>
