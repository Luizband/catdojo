<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatDojo - Entrada</title>
    <style>
        /* RESET BÁSICO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        /* CONTAINER PRINCIPAL COM O FUNDO */
        #app {
            width: 100%;
            max-width: 414px;
            height: 100%;
            position: relative;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center; 
            justify-content: center;
            
            /* Usando a imagem de fundo */
            background-image: url('fundo.png');
            background-size: cover;
            background-position: center;
        }

        /* Filtro preto opaco de 45% */
        #app::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.45); 
            z-index: 1;
        }

        /* PAINEL DE PERGAMINHO */
        .painel-login {
            position: relative;
            z-index: 2;
            width: 85%;
            background-color: #f1ddb0; 
            border: 3px solid #5a4231;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            
            box-shadow: 0px 10px 20px rgba(0,0,0,0.5), inset 0px 0px 20px rgba(139, 90, 43, 0.15);
        }

        /* LOGO */
        .logo-titulo {
            margin-bottom: 25px;
        }

        .logo-titulo img {
            width: 100%;
            max-width: 220px; /* Mantém a logo num tamanho legal */
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
        }

        /* CAMPOS DE TEXTO (Inputs) */
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #fdf5e6; 
            border: 2px solid #a68a61;
            border-radius: 6px;
            font-size: 1em;
            color: #2a2a2a;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input[type="email"]::placeholder, input[type="password"]::placeholder {
            color: #bfa580;
        }

        input[type="email"]:focus, input[type="password"]:focus {
            border-color: #5a4231;
        }

        /* CHECKBOX GRAVAR E-MAIL */
        .lembrar-email {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            margin-top: -5px; /* Puxa um pouco pra cima, perto da senha */
            text-align: left;
            color: #2a2a2a;
            font-weight: bold;
            font-size: 0.9em;
        }

        .lembrar-email input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #5a4231; /* Deixa o quadradinho marrom quando clicado */
        }

        .lembrar-email label {
            cursor: pointer;
        }

        /* BOTÕES ESTILO PERGAMINHO / MADEIRA */
        .btn-pergaminho {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background-color: #dfc495;
            color: #2a2a2a;
            font-size: 1.1em;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #5a4231;
            border-radius: 8px;
            cursor: pointer;
            
            box-shadow: 0px 4px 0px #5a4231;
            transition: all 0.1s;
        }

        .btn-pergaminho:active {
            box-shadow: 0px 0px 0px #5a4231;
            transform: translateY(4px);
        }

        .btn-secundario {
            background-color: transparent;
            border: 2px dashed #a68a61;
            box-shadow: none;
            margin-top: 15px;
            color: #5a4231;
        }

        .btn-secundario:active {
            transform: scale(0.98);
        }

        .divisor {
            margin: 20px 0;
            height: 2px;
            background-color: #a68a61;
            position: relative;
        }

        .divisor span {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f1ddb0;
            padding: 0 10px;
            color: #a68a61;
            font-size: 0.9em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="painel-login">
            
            <div class="logo-titulo">
                <img src="logo.png" alt="Logo CatDojo">
            </div>
            
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">
            
            <div class="lembrar-email">
                <input type="checkbox" id="lembrarEmail">
                <label for="lembrarEmail">Gravar e-mail</label>
            </div>
            
            <button class="btn-pergaminho" id="btnLogin">Entrar no Dojo</button>
            
            <div class="divisor">
                <span>OU</span>
            </div>
            
            <button class="btn-pergaminho btn-secundario" id="btnRegistro">Fundar Novo Clã</button>

        </div>
    </div>

    <script type="module">
        // Lógica do Firebase
    </script>
</body>
</html>
