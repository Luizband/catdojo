<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CatDojo - Loja</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a4231">
    <style>
        /* RESET BÁSICO */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #2c2c2c; display: flex; justify-content: center; height: 100vh; overflow: hidden; }

        #app {
            width: 100%; max-width: 414px; height: 100%; position: relative;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column;
            background-color: #3e2723; /* Fundo escuro para a loja */
            background-image: url('imagens/fundoloja.png');
            background-size: cover; background-position: center;
        }
        #app::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.6); z-index: 1; /* Mais escuro para dar destaque aos itens */
        }

        .conteudo-app { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }

        /* CABEÇALHO PADRÃO */
        header { background-color: #dfc495; padding: 10px 15px; border-bottom: 3px solid #5a4231; }
        .perfil-info { display: flex; gap: 15px; }
        .foto-cla {
            width: 60px; height: 60px; background-color: #ffffff; border: 3px solid #5a4231;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: #a68a61; font-size: 0.7em; font-weight: bold; box-shadow: 0px 3px 0px #5a4231;
        }
        .dados-cla h2 { font-size: 1em; color: #2a2a2a; text-transform: uppercase; }
        .dados-cla p { font-size: 0.8em; color: #2a2a2a; font-weight: bold; margin-bottom: 5px; }
        .economia { display: flex; gap: 15px; font-size: 0.8em; font-weight: bold; color: #4a3b32; }
        .economia div { display: flex; align-items: center; gap: 5px; }
        .economia img { width: 18px; }
        
        .titulo-pagina { text-align: center; background-color: #5a4231; color: #f1ddb0; padding: 5px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;}

        /* ÁREA DA LOJA (CATÁLOGO DE ITENS) */
        main { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .card-loja {
            background-color: #f1ddb0; border: 3px solid #5a4231; border-radius: 10px;
            padding: 12px; display: flex; gap: 15px; align-items: center;
            box-shadow: 0px 4px 0px #5a4231; position: relative;
        }

        .card-loja .icone-container {
            width: 70px; height: 70px; background-color: #dfc495; border: 2px solid #a68a61;
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; position: relative;
        }
        
        .card-loja img.item-foto { width: 80%; height: 80%; object-fit: contain; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3)); }
        
        /* Etiqueta de tamanho físico do item */
        .etiqueta-tamanho {
            position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            background-color: #2c2c2c; color: white; font-size: 0.65em; font-weight: bold;
            padding: 2px 6px; border-radius: 4px; border: 1px solid #dfc495; white-space: nowrap;
        }

        .card-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .card-info h4 { font-size: 1.05em; color: #2a2a2a; text-transform: uppercase; margin-bottom: 2px; }
        .card-info p { font-size: 0.75em; color: #5a4231; font-weight: bold; line-height: 1.1em; margin-bottom: 8px; }
        
        .btn-comprar {
            background-color: #d27d46; color: white; border: 2px solid #5a4231; padding: 8px;
            border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0px 3px 0px #5a4231;
            display: flex; align-items: center; justify-content: center; gap: 5px; text-transform: uppercase; font-size: 0.8em;
        }
        .btn-comprar:active { box-shadow: 0px 0px 0px #5a4231; transform: translateY(3px); }
        .btn-comprar img { width: 14px; height: 14px; }
        
        /* Filtros de Categoria */
        .filtros-loja { 
            display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; 
            padding-bottom: 5px; flex-shrink: 0; /* Impede que a barra seja esmagada */
            -ms-overflow-style: none; scrollbar-width: none; /* Oculta scrollbar no Firefox/Edge */
        }
        .filtros-loja::-webkit-scrollbar { 
            display: none; /* Oculta scrollbar no Chrome/Safari/Mobile */
        }

        /* NAVEGAÇÃO INFERIOR */
        nav { background-color: #e5cd9e; border-top: 3px solid #5a4231; display: flex; justify-content: space-around; padding: 10px 5px; flex-shrink: 0;}
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75em; font-weight: bold; color: #4a3b32; cursor: pointer; text-decoration: none;}
        .nav-item img { width: 40px; margin-bottom: 3px; }

        /* SISTEMA DE AVISOS */
        #toastContainer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-msg { background-color: #2c2c2c; color: #f1ddb0; padding: 12px 24px; border: 2px solid #dfc495; border-radius: 8px; font-weight: bold; text-align: center; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); animation: fadeInOut 2s forwards; text-transform: uppercase; font-size: 0.85em; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(-10px); } 10% { opacity: 1; transform: translateY(0); } 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }

        .modal-centro { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.85); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .painel-centro { background-color: #f1ddb0; width: 85%; max-width: 320px; border: 3px solid #5a4231; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0px 10px 20px rgba(0,0,0,0.5); }
        .painel-centro p { color: #2a2a2a; font-weight: bold; margin-bottom: 20px; font-size: 1.05em; }
        .botoes-centro { display: flex; gap: 10px; justify-content: center; }
        .btn-centro { flex: 1; padding: 10px; background-color: #dfc495; border: 2px solid #5a4231; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0px 3px 0px #5a4231; color: #2a2a2a; text-transform: uppercase; }
        .btn-centro:active { box-shadow: 0px 0px 0px #5a4231; transform: translateY(3px); }
        .btn-centro.cancelar { background-color: transparent; border: 2px dashed #a68a61; box-shadow: none; }
    </style>
</head>
<body>
    <div id="toastContainer"></div>
    <div class="modal-centro" id="modalConfirmacao">
        <div class="painel-centro">
            <p id="textoConfirmacao">Tem certeza?</p>
            <div class="botoes-centro">
                <button class="btn-centro cancelar" id="btnCancelarConfirm">Cancelar</button>
                <button class="btn-centro" id="btnAceitarConfirm">Comprar</button>
            </div>
        </div>
    </div>

    <div id="app">
        <div class="conteudo-app">
            <header>
                <div class="perfil-info">
                    <div class="foto-cla" id="fotoClaContainer"><span id="placeholderFoto">FOTO</span></div>
                    <div class="dados-cla">
                        <h2 id="exibeNomeCla">CARREGANDO...</h2>
                        <p id="exibeNomeMestre">Mestre...</p>
                        <div class="economia">
                            <div><img src="icones/moeda.png" alt="Moedas"> <span id="exibeMoedas" style="color:#d27d46;">0</span></div>
                            <div><img src="icones/rep.png" alt="Reputação"> <span id="exibeReputacao">0/500</span></div>
                        </div>
                    </div>
                </div>
            </header>
            <div class="titulo-pagina">Mercador</div>

            <main>
                <div class="filtros-loja" id="containerFiltros">
                    <button class="btn-filtro ativo" data-filtro="todos">Todos</button>
                    <button class="btn-filtro" data-filtro="alimento">Alimentos</button>
                    <button class="btn-filtro" data-filtro="missao">Equipamentos & Missão</button>
                    <button class="btn-filtro" data-filtro="especial">Especiais</button>
                </div>

                <div id="listaItensLoja">
                    </div>
            </main>

            <nav>
                <a href="dojo.html" class="nav-item"><img src="icones/Dojo.png" alt="Dojo">DOJO</a>
                <a href="dormitorio.html" class="nav-item"><img src="icones/dormitorio.png" alt="Dormitório">DORMITÓRIO</a>
                <a href="deposito.html" class="nav-item"><img src="icones/deposito.png" alt="Depósito">DEPÓSITO</a>
                <a href="arena.html" class="nav-item"><img src="icones/arena.png" alt="Arena">ARENA</a>
            </nav>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { ITENS } from './itens.js';

        let jogadorUid = null;
        let dadosGlobais = null;
        let inventarioInstancias = [];
        let linhasTotais = 7;
        let filtroAtual = 'todos';

        // ==========================================
        // SISTEMA DE AVISOS
        // ==========================================
        function mostrarToast(mensagem) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.textContent = mensagem;
            toast.onclick = () => toast.remove();
            container.appendChild(toast);
            setTimeout(() => { if(toast.parentElement) toast.remove(); }, 2000);
        }

        function pedirConfirmacao(mensagem, callback) {
            document.getElementById('textoConfirmacao').textContent = mensagem;
            document.getElementById('modalConfirmacao').style.display = 'flex';
            document.getElementById('btnAceitarConfirm').onclick = () => { document.getElementById('modalConfirmacao').style.display = 'none'; callback(); };
            document.getElementById('btnCancelarConfirm').onclick = () => { document.getElementById('modalConfirmacao').style.display = 'none'; };
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                jogadorUid = user.uid;
                await carregarDadosUsuario();
                renderizarLoja();
            } else {
                window.location.href = "index.html";
            }
        });

        async function carregarDadosUsuario() {
            const docRef = doc(db, "Clas", jogadorUid);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                dadosGlobais = docSnap.data();
                
                let textoCla = dadosGlobais.nomeCla ? dadosGlobais.nomeCla.trim() : "DESCONHECIDO";
                if (!textoCla.toUpperCase().startsWith("CLÃ")) textoCla = "CLÃ " + textoCla;
                document.getElementById('exibeNomeCla').textContent = textoCla.toUpperCase();
                
                let textoMestre = dadosGlobais.nomeMestre ? dadosGlobais.nomeMestre.trim() : "...";
                if (!textoMestre.toUpperCase().startsWith("MESTRE")) textoMestre = "Mestre " + textoMestre;
                document.getElementById('exibeNomeMestre').textContent = textoMestre;
                
                document.getElementById('exibeMoedas').textContent = dadosGlobais.moedas || 0;
                document.getElementById('exibeReputacao').textContent = `${dadosGlobais.reputacao || 0}/500`;
                
                if (dadosGlobais.avatar) {
                    document.getElementById('fotoClaContainer').innerHTML = `<img src="${dadosGlobais.avatar}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">`;
                }

                inventarioInstancias = dadosGlobais.inventarioInstancias || [];
                linhasTotais = 6 + (dadosGlobais.nivelDeposito || 1);
            }
        }

        // ==========================================
        // LÓGICA DE FÍSICA E ESPAÇO NO DEPÓSITO
        // ==========================================
        // Precisamos desta função aqui para garantir que o jogador só compre se houver espaço!
        function podeColocar(x, y, larg, alt, idIgnorado) {
            if (x < 0 || y < 0 || x + larg > 5 || y + alt > linhasTotais) return false;
            
            for (let inst of inventarioInstancias) {
                if (inst.idInstancia === idIgnorado) continue;
                let ref = ITENS[inst.itemId];
                if (!ref) continue;
                
                if (x < inst.x + ref.espaco.largura && x + larg > inst.x &&
                    y < inst.y + ref.espaco.altura && y + alt > inst.y) {
                    return false;
                }
            }
            return true;
        }

        function encontrarEspacoLivre(larg, alt) {
            for (let y = 0; y <= linhasTotais - alt; y++) {
                for (let x = 0; x <= 5 - larg; x++) {
                    if (podeColocar(x, y, larg, alt, null)) return {x, y};
                }
            }
            return null; // Não há buraco físico com esse tamanho
        }

        // ==========================================
        // RENDERIZAÇÃO DA LOJA
        // ==========================================
        function renderizarLoja() {
            const container = document.getElementById('listaItensLoja');
            container.innerHTML = '';

            Object.keys(ITENS).forEach(chave => {
                const item = ITENS[chave];
                
                // Aplica o filtro de abas
                if (filtroAtual !== 'todos' && item.tipo !== filtroAtual) return;

                const divCard = document.createElement('div');
                divCard.className = 'card-loja';
                
                divCard.innerHTML = `
                    <div class="icone-container">
                        <img src="${item.icone}" class="item-foto" alt="${item.nome}">
                        <div class="etiqueta-tamanho">${item.espaco.largura}x${item.espaco.altura}</div>
                    </div>
                    <div class="card-info">
                        <h4>${item.nome}</h4>
                        <p>${item.desc}</p>
                        <button class="btn-comprar">
                            Comprar <img src="icones/moeda.png" alt="M"> ${item.preco}
                        </button>
                    </div>
                `;

                // Adiciona o evento de compra
                divCard.querySelector('.btn-comprar').onclick = () => tentarComprar(chave, item);
                container.appendChild(divCard);
            });
        }

        // ==========================================
        // SISTEMA DE COMPRA
        // ==========================================
        async function tentarComprar(idItem, itemRef) {
            const moedasAtuais = dadosGlobais.moedas || 0;

            // 1. Checa o Dinheiro
            if (moedasAtuais < itemRef.preco) {
                mostrarToast(`Faltam moedas para comprar ${itemRef.nome}!`);
                return;
            }

            // 2. Checa o Espaço Físico (A grande mágica)
            const espacoLivre = encontrarEspacoLivre(itemRef.espaco.largura, itemRef.espaco.altura);
            
            if (!espacoLivre) {
                mostrarToast(`Sem espaço no Depósito para um item ${itemRef.espaco.largura}x${itemRef.espaco.altura}! Organize seus itens.`);
                return;
            }

            // 3. Pede Confirmação
            pedirConfirmacao(`Comprar ${itemRef.nome} por ${itemRef.preco} moedas?`, async () => {
                try {
                    // Deduz o dinheiro
                    const novasMoedas = moedasAtuais - itemRef.preco;
                    
                    // Cria a instância física no espaço que encontramos
                    const novaInstancia = {
                        idInstancia: `item_${Date.now()}_${Math.floor(Math.random()*1000)}`,
                        itemId: idItem,
                        x: espacoLivre.x,
                        y: espacoLivre.y
                    };
                    
                    inventarioInstancias.push(novaInstancia);

                    // Salva tudo de uma vez no Firebase
                    const docRef = doc(db, "Clas", jogadorUid);
                    await updateDoc(docRef, { 
                        moedas: novasMoedas,
                        inventarioInstancias: inventarioInstancias
                    });

                    // Atualiza a interface local
                    dadosGlobais.moedas = novasMoedas;
                    document.getElementById('exibeMoedas').textContent = novasMoedas;
                    
                    mostrarToast(`${itemRef.nome} comprado e guardado no Depósito!`);
                } catch (e) {
                    console.error("Erro na compra:", e);
                    mostrarToast("Ocorreu um erro na conexão.");
                }
            });
        }

        // ==========================================
        // FILTROS (ABAS DA LOJA)
        // ==========================================
        document.querySelectorAll('.btn-filtro').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('ativo'));
                e.target.classList.add('ativo');
                filtroAtual = e.target.getAttribute('data-filtro');
                renderizarLoja();
            };
        });

        // Ativa PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>
</html>
