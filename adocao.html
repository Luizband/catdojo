<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CatDojo - Adoção</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a4231">
    <style>
        /* RESET BÁSICO E TRAVA DE ECRÃ */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { background-color: #2c2c2c; display: flex; justify-content: center; position: fixed; top: 0; bottom: 0; left: 0; right: 0; width: 100%; overflow: hidden; }

        #app {
            width: 100%; max-width: 414px; height: 100%; position: relative;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column;
            background-color: #3e2723;
            background-image: url('imagens/fundomissoes.png');
            background-size: cover; background-position: center;
        }
        #app::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.65); z-index: 1; }
        .conteudo-app { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }

        /* CABEÇALHO PADRÃO (Estilo Pergaminho) */
        header {
            background-color: #dfc495;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px solid #5a4231;
            position: relative;
        }
        
        .perfil-info { display: flex; gap: 15px; flex: 1; }

        .foto-cla {
            position: absolute; top: 0; left: 0; bottom: 0; width: 90px;
            background-color: transparent; border: none; border-radius: 0; box-shadow: none; overflow: hidden;
        }

        .dados-cla {
            margin-left: 90px;
            display: flex; flex-direction: column; justify-content: center;
        }

        .dados-cla h2 { font-size: 1.25em; color: #2a2a2a; text-transform: uppercase; }
        .dados-cla p { font-size: 1.0em; color: #2a2a2a; font-weight: bold; margin-bottom: 5px; }

        .economia { display: flex; gap: 15px; font-size: 0.95em; font-weight: bold; color: #4a3b32; }
        .economia div { display: flex; align-items: center; gap: 5px; }
        .economia img { width: 23px; }

        .botoes-topo { display: flex; flex-direction: column; gap: 5px; }
        .botoes-topo img {
            width: 40px; background-color: #dfc495; border: 2px solid #5a4231; border-radius: 8px;
            padding: 4px; cursor: pointer; box-shadow: 0px 3px 0px #5a4231; transition: all 0.1s;
        }
        .botoes-topo img:active { box-shadow: 0px 0px 0px #5a4231; transform: translateY(3px); }
        
        .titulo-pagina { text-align: center; background-color: #5a4231; color: #f1ddb0; padding: 5px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;}

        /* AVISO TEMPO / VAGAS */
        .info-patio { display: flex; justify-content: space-between; padding: 10px 15px; background: rgba(90, 66, 49, 0.85); color: #f1ddb0; font-size: 0.8em; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid #3e2723;}
        
        main { flex: 1; min-height: 0; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

        /* GRID DO PÁTIO */
        .grid-adocao { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding-bottom: 20px;}
        
        .card-gato { background-color: #fdf5e6; border: 3px solid #5a4231; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0px 4px 0px #5a4231;}
        .card-gato-header { background-color: #dfc495; padding: 5px; text-align: center; border-bottom: 2px solid #5a4231; color: #2a2a2a; font-weight: bold; text-transform: uppercase; font-size: 0.85em; }
        
        .card-foto-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; background-color: #e5cd9e; display: flex; align-items: flex-end; justify-content: center; }
        .card-foto-wrapper img { width: 90%; height: 90%; object-fit: contain; object-position: bottom; }
        .idade-badge { position: absolute; top: 5px; left: 5px; background: rgba(44, 44, 44, 0.8); color: #f1ddb0; padding: 2px 6px; border-radius: 4px; font-size: 0.65em; font-weight: bold; }
        .pontos-badge { position: absolute; top: 5px; right: 5px; background: #3399ff; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.65em; font-weight: bold; border: 1px solid #2a2a2a; }

        .card-stats { padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.75em; font-weight: bold; color: #4a3b32; background: #f1ddb0; border-bottom: 2px dashed #a68a61;}
        .stat-item { display: flex; justify-content: space-between; }
        
        .card-footer { padding: 10px; display: flex; flex-direction: column; gap: 5px; background: #fdf5e6;}
        .req-linha { display: flex; justify-content: space-between; font-size: 0.8em; font-weight: bold; color: #5a4231;}
        .req-linha img { width: 14px; margin-right: 4px; vertical-align: middle;}
        
        .btn-adotar { background-color: #4CAF50; color: white; border: 2px solid #2E7D32; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0px 3px 0px #2E7D32; text-transform: uppercase; font-size: 0.8em; margin-top: 5px; transition: 0.1s;}
        .btn-adotar:active { transform: translateY(3px); box-shadow: 0px 0px 0px #2E7D32; }
        .btn-adotar.bloqueado { background-color: #7b7b7b; border-color: #4a4a4a; box-shadow: 0px 3px 0px #4a4a4a; color: #ccc; cursor: not-allowed; }

        /* NAVEGAÇÃO INFERIOR */
        nav { background-color: #e5cd9e; border-top: 3px solid #5a4231; display: flex; justify-content: space-around; flex-shrink: 0; padding: 10px 5px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75em; font-weight: bold; color: #4a3b32; cursor: pointer; text-decoration: none; text-transform: uppercase; }
        .nav-item img { width: 40px; margin-bottom: 3px; }

        /* AVISOS E CONFIRMAÇÕES */
        #toastContainer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-msg { background-color: #2c2c2c; color: #f1ddb0; padding: 12px 24px; border: 2px solid #dfc495; border-radius: 8px; font-weight: bold; text-align: center; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); animation: fadeInOut 2s forwards; text-transform: uppercase; font-size: 0.85em; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(-10px); } 10% { opacity: 1; transform: translateY(0); } 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
        
        .modal-centro { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.85); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .painel-centro { background-color: #f1ddb0; width: 85%; max-width: 320px; border: 3px solid #5a4231; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0px 10px 20px rgba(0,0,0,0.5); }
        .painel-centro p { color: #2a2a2a; font-weight: bold; margin-bottom: 20px; font-size: 0.95em; line-height: 1.4em;}
        .botoes-centro { display: flex; gap: 10px; justify-content: center; }
        .btn-centro { flex: 1; padding: 10px; background-color: #dfc495; border: 2px solid #5a4231; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0px 3px 0px #5a4231; color: #2a2a2a; text-transform: uppercase; }
        .btn-centro:active { box-shadow: 0px 0px 0px #5a4231; transform: translateY(3px); }
        .btn-centro.cancelar { background-color: transparent; border: 2px dashed #a68a61; box-shadow: none; }
    </style>
</head>
<body>
    <div id="toastContainer"></div>
    <div class="modal-centro" id="modalConfirmacao">
        <div class="painel-centro">
            <p id="textoConfirmacao"></p>
            <div class="botoes-centro">
                <button class="btn-centro cancelar" id="btnCancelarConfirm">Cancelar</button>
                <button class="btn-centro" id="btnAceitarConfirm">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="app">
        <div class="conteudo-app">
            <header>
                <div class="perfil-info">
                    <div class="foto-cla" id="fotoClaContainer">
                        <span id="placeholderFoto">FOTO</span>
                    </div>
                    <div class="dados-cla">
                        <h2 id="exibeNomeCla">CARREGANDO...</h2>
                        <p id="exibeNomeMestre">Mestre...</p>
                        <div class="economia">
                            <div><img src="icones/moeda.png" alt="Moedas"> <span id="exibeMoedas">0</span></div>
                            <div><img src="icones/rep.png" alt="Reputação"> <span id="exibeReputacao">0/500</span></div>
                        </div>
                    </div>
                </div>
                <!-- Opcional: Remova se não quiser os botões nesta tela -->
                <div class="botoes-topo">
                    <img src="icones/config.png" alt="Configurações">
                    <img src="icones/log.png" alt="Diário">
                </div>
            </header>
            
            <div class="titulo-pagina">PÁTIO DE ADOÇÃO</div>

            <div class="info-patio">
                <span id="textoVagas">Vagas: 0/0</span>
                <span id="timerRotacao">Próxima Leva: --:--:--</span>
            </div>

            <main>
                <div class="grid-adocao" id="gridGatos">
                    <!-- Cards injetados via JS -->
                </div>
            </main>

            <nav>
                <div class="nav-item" onclick="window.location.href='dojo.html'">
                    <img src="icones/Dojo.png" alt="Dojo">
                    DOJO
                </div>
                <div class="nav-item" onclick="window.location.href='dormitorio.html'">
                    <img src="icones/dormitorio.png" alt="Dormitório">
                    DORMITÓRIO
                </div>
                <div class="nav-item" onclick="window.location.href='arena.html'">
                    <img src="icones/arena.png" alt="Arena">
                    ARENA
                </div>
                <div class="nav-item" onclick="window.location.href='loja.html'">
                    <img src="icones/loja.png" alt="Loja">
                    LOJA
                </div>
            </nav>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDoc, doc, updateDoc, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // DADOS GLOBAIS DE NOMES PARA GERAÇÃO PROCEDURAL
        // ==========================================
        const NOMES_GATOS = [
            "Ronin", "Sombra", "Yuki", "Tigre", "Ninja", "Fumaça", "Loki", "Simba", "Felix", "Neko",
            "Salem", "Luna", "Tom", "Frajola", "Zoro", "Kira", "Goku", "Arya", "Leo", "Miau",
            "Thor", "Zeus", "Apolo", "Nero", "Fera", "Pudim", "Cacau", "Mel", "Pipoca", "Koda",
            "Milo", "Oliver", "Chico", "Barth", "Jorge", "Freddy", "Dexter", "Tito", "Ryu", "Ken",
            "Akuma", "Bison", "Sagat", "Vega", "Chun", "Gohan", "Bidu", "Nala", "Mia", "Zeca"
        ];

        let jogadorUid = null;
        let dadosGlobais = null;
        let gatosVivosCount = 0;
        let vagasTotais = 0;
        let patioAtual = {};

        const TEMPO_ROTACAO_MS = 10 * 60 * 60 * 1000; // 10 horas em ms

        window.mostrarToast = function(mensagem) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div'); toast.className = 'toast-msg'; toast.textContent = mensagem;
            container.appendChild(toast); setTimeout(() => toast.remove(), 2500);
        }

        function pedirConfirmacao(mensagem, callback) {
            document.getElementById('textoConfirmacao').textContent = mensagem;
            document.getElementById('modalConfirmacao').style.display = 'flex';
            document.getElementById('btnAceitarConfirm').onclick = () => { document.getElementById('modalConfirmacao').style.display = 'none'; callback(); };
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                jogadorUid = user.uid;
                await carregarDados();
                setInterval(atualizarRelogio, 1000);
            } else { window.location.href = "index.html"; }
        });

        async function carregarDados() {
            const docRef = doc(db, "Clas", jogadorUid);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                dadosGlobais = docSnap.data();
                
                // Preenche Cabeçalho
                let textoCla = dadosGlobais.nomeCla ? dadosGlobais.nomeCla.trim() : "DESCONHECIDO";
                if (!textoCla.toUpperCase().startsWith("CLÃ") && !textoCla.toUpperCase().startsWith("CLA")) { textoCla = "CLÃ " + textoCla; }
                document.getElementById('exibeNomeCla').textContent = textoCla.toUpperCase();

                let textoMestre = dadosGlobais.nomeMestre ? dadosGlobais.nomeMestre.trim() : "...";
                if (!textoMestre.toUpperCase().startsWith("MESTRE")) { textoMestre = "Mestre " + textoMestre; }
                document.getElementById('exibeNomeMestre').textContent = textoMestre;

                document.getElementById('exibeMoedas').textContent = dadosGlobais.moedas !== undefined ? dadosGlobais.moedas : 50;
                document.getElementById('exibeReputacao').textContent = `${dadosGlobais.reputacao || 0}/500`;
                
                if (dadosGlobais.avatar) document.getElementById('fotoClaContainer').innerHTML = `<img src="${dadosGlobais.avatar}" style="display: block; width: 100%; height: 100%; object-fit: cover;">`;

                vagasTotais = dadosGlobais.vagasDormitorio || 3;
            }

            // Conta Gatos Vivos no Dormitório
            gatosVivosCount = 0;
            const gatosRef = collection(db, "Clas", jogadorUid, "Gatos");
            const qSnap = await getDocs(gatosRef);
            qSnap.forEach(doc => {
                if (doc.data().estado !== 'Morto') gatosVivosCount++;
            });

            document.getElementById('textoVagas').textContent = `Vagas: ${gatosVivosCount}/${vagasTotais}`;

            await gerenciarRotacaoPatio();
        }

        // ==========================================
        // MOTOR MATEMÁTICO: GERAÇÃO DE GATOS
        // ==========================================
        function distribuirPontos(totalDesejado) {
            let attrs = { forca: 1, agilidade: 1, resistencia: 1, foco: 1, vigor: 1 };
            let pontosRestantes = totalDesejado - 5; // Já começam com 1 em cada
            const chaves = Object.keys(attrs);
            
            while(pontosRestantes > 0) {
                let sorteado = chaves[Math.floor(Math.random() * chaves.length)];
                attrs[sorteado]++;
                pontosRestantes--;
            }
            return attrs;
        }

        function gerarGatoTier(tier) {
            const nome = NOMES_GATOS[Math.floor(Math.random() * NOMES_GATOS.length)];
            const foto = `imagens/gato${String(Math.floor(Math.random() * 17) + 1).padStart(2, '0')}.png`;
            
            let totalPts = 10, custo = 50, repReq = 0, idadeH = 0, idadeTexto = "Filhote";
            
            if (tier === 1) { // 10 pts
                totalPts = 10; custo = 50; repReq = 0; idadeH = 0; idadeTexto = "Filhote";
            } else if (tier === 2) { // 11 a 13 pts
                totalPts = Math.floor(Math.random() * 3) + 11;
                custo = Math.floor(Math.random() * 41) + 60; // 60 a 100
                repReq = 10; idadeH = 168; idadeTexto = "1 Semana";
            } else if (tier === 3) { // 14 a 15 pts
                totalPts = Math.floor(Math.random() * 2) + 14;
                custo = Math.floor(Math.random() * 51) + 100; // 100 a 150
                repReq = 20; idadeH = 504; idadeTexto = "3 Semanas";
            } else if (tier === 4) { // 16 a 17 pts
                totalPts = Math.floor(Math.random() * 2) + 16;
                custo = 200; repReq = 60; idadeH = 720; idadeTexto = "1 Mês";
            }
            
            const atributos = distribuirPontos(totalPts);
            const hpCalculado = 250 + (atributos.resistencia * 15);
            
            return {
                tier: tier, nome: nome, foto: foto, 
                idadeTexto: idadeTexto, idadeHoras: idadeH,
                totalPts: totalPts, custo: custo, repReq: repReq,
                atributos: atributos,
                hpMax: hpCalculado, hpAtual: hpCalculado,
                fome: 100, estado: 'Saudável', xpAtual: 0, nivel: 1, faixa: 'Branca', pontosLivres: 0, xpProxFaixa: 500
            };
        }

        async function gerenciarRotacaoPatio() {
            const agora = Date.now();
            patioAtual = dadosGlobais.patioAdocao || { expiraEm: 0, gatos: [] };

            // Se expirou OU não tem os 4 gatos, recria a lista
            if (agora >= patioAtual.expiraEm || patioAtual.gatos.length < 4) {
                patioAtual = {
                    expiraEm: agora + TEMPO_ROTACAO_MS,
                    gatos: [gerarGatoTier(1), gerarGatoTier(2), gerarGatoTier(3), gerarGatoTier(4)]
                };
                await updateDoc(doc(db, "Clas", jogadorUid), { patioAdocao: patioAtual });
            }

            renderizarGridPatio();
        }

        function renderizarGridPatio() {
            const container = document.getElementById('gridGatos');
            container.innerHTML = '';
            const reputacaoAtual = dadosGlobais.reputacao || 0;

            patioAtual.gatos.forEach((gato, index) => {
                const bloqueadoRep = reputacaoAtual < gato.repReq;
                const bloqueadoVaga = gatosVivosCount >= vagasTotais;
                const bloqueadoMoeda = (dadosGlobais.moedas || 0) < gato.custo;
                const botaoClasses = (bloqueadoRep || bloqueadoVaga || bloqueadoMoeda) ? 'btn-adotar bloqueado' : 'btn-adotar';
                
                let motivoBloqueio = "";
                if (bloqueadoVaga) motivoBloqueio = "Dormitório Cheio";
                else if (bloqueadoRep) motivoBloqueio = "Falta Reputação";
                else if (bloqueadoMoeda) motivoBloqueio = "Falta Moedas";

                const div = document.createElement('div');
                div.className = 'card-gato';
                div.innerHTML = `
                    <div class="card-gato-header">${gato.nome}</div>
                    <div class="card-foto-wrapper">
                        <span class="idade-badge">${gato.idadeTexto}</span>
                        <span class="pontos-badge">${gato.totalPts} Pts Base</span>
                        <img src="${gato.foto}" alt="Foto">
                    </div>
                    <div class="card-stats">
                        <div class="stat-item">STR: <span>${gato.atributos.forca}</span></div>
                        <div class="stat-item">AGI: <span>${gato.atributos.agilidade}</span></div>
                        <div class="stat-item">RES: <span>${gato.atributos.resistencia}</span></div>
                        <div class="stat-item">FOC: <span>${gato.atributos.foco}</span></div>
                    </div>
                    <div class="card-footer">
                        <div class="req-linha" style="color: ${bloqueadoRep ? '#cc3333' : '#2E7D32'}">
                            <span><img src="icones/rep.png"> Exige:</span> <span>${gato.repReq}</span>
                        </div>
                        <div class="req-linha" style="color: ${bloqueadoMoeda ? '#cc3333' : '#4a3b32'}">
                            <span><img src="icones/moeda.png"> Custo:</span> <span>${gato.custo}</span>
                        </div>
                        <button class="${botaoClasses}" onclick="tentarAdotar(${index})">${motivoBloqueio ? motivoBloqueio : 'Adotar'}</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.tentarAdotar = (index) => {
            const gato = patioAtual.gatos[index];
            const reputacaoAtual = dadosGlobais.reputacao || 0;
            const moedasAtuais = dadosGlobais.moedas || 0;

            if (gatosVivosCount >= vagasTotais) { mostrarToast("Seu dormitório está lotado!"); return; }
            if (reputacaoAtual < gato.repReq) { mostrarToast("Reputação do Clã insuficiente!"); return; }
            if (moedasAtuais < gato.custo) { mostrarToast("Moedas insuficientes!"); return; }

            pedirConfirmacao(`Pagar ${gato.custo} moedas para adotar ${gato.nome}?`, async () => {
                try {
                    // 1. Debita o valor e injeta no Banco de Dados do jogador
                    const claRef = doc(db, "Clas", jogadorUid);
                    await updateDoc(claRef, { moedas: moedasAtuais - gato.custo });

                    // 2. Prepara o documento do novo gato (sem as variáveis de controle do pátio)
                    const gatoParaSalvar = {
                        nome: gato.nome, foto: gato.foto, idadeHoras: gato.idadeHoras,
                        atributos: gato.atributos, hpMax: gato.hpMax, hpAtual: gato.hpAtual,
                        fome: 100, estado: 'Saudável', xpAtual: 0, nivel: 1, faixa: 'Branca', pontosLivres: 0, xpProxFaixa: 500,
                        ultimaAtualizacao: Date.now()
                    };

                    // 3. Adiciona na Subcoleção (O Firebase gera o ID automaticamente agora)
                    const gatosRef = collection(db, "Clas", jogadorUid, "Gatos");
                    await addDoc(gatosRef, gatoParaSalvar);

                    // 4. Reposição Imediata: O GDD dita que entra outro gerado na mesma faixa de pontos
                    patioAtual.gatos[index] = gerarGatoTier(gato.tier);
                    await updateDoc(claRef, { patioAdocao: patioAtual });

                    mostrarToast(`${gato.nome} agora faz parte do Dojo!`);
                    
                    // Recarrega tudo para atualizar o layout
                    await carregarDados();
                } catch (e) {
                    console.error("Erro ao adotar:", e);
                }
            });
        };

        function atualizarRelogio() {
            if (!patioAtual.expiraEm) return;
            const agora = Date.now();
            const tempoRestante = patioAtual.expiraEm - agora;

            if (tempoRestante <= 0) {
                gerenciarRotacaoPatio();
            } else {
                const s = Math.floor(tempoRestante / 1000);
                const h = Math.floor(s / 3600);
                const min = Math.floor((s % 3600) / 60);
                const sec = s % 60;
                document.getElementById('timerRotacao').textContent = `Atualiza em: ${h}h ${min}m ${sec}s`;
            }
        }

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js')); }
    </script>
</body>
</html>
