<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CatDojo - Arena</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a4231">
    <style>
        /* RESET BÁSICO E CORES PADRÃO */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { background-color: #2c2c2c; display: flex; justify-content: center; position: fixed; top: 0; bottom: 0; left: 0; right: 0; width: 100%; overflow: hidden; }
        #app { width: 100%; max-width: 414px; height: 100%; position: relative; display: flex; flex-direction: column; background-image: url('imagens/fundoarena.png'); background-size: cover; background-position: center; }
        #app::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.7); z-index: 1; }
        .conteudo-app { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }

        header { background-color: #dfc495; padding: 10px; text-align: center; border-bottom: 3px solid #5a4231; font-weight: bold; font-size: 1.2em; color: #2a2a2a; text-transform: uppercase; }
        nav { background-color: #e5cd9e; border-top: 3px solid #5a4231; display: flex; justify-content: space-around; padding: 10px 5px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); flex-shrink: 0;}
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75em; font-weight: bold; color: #4a3b32; cursor: pointer; text-decoration: none;}
        .nav-item img { width: 40px; margin-bottom: 3px; }

        /* LOBBY E ABAS */
        .abas-arena { display: flex; width: 100%; background: #5a4231; flex-shrink: 0;}
        .aba { flex: 1; padding: 12px; text-align: center; color: #dfc495; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; }
        .aba.ativa { border-bottom: 3px solid #d27d46; color: #f1ddb0; background: #4a3b32; }

        .lista-container { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .lista-container.ativa { display: flex; flex-direction: column; gap: 10px; }

        /* CARDS E BOTÕES GERAIS */
        .card-adv { background-color: #dfc495; border: 3px solid #5a4231; border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer;}
        .card-adv img { width: 60px; height: 60px; border-radius: 8px; border: 2px solid #5a4231; object-fit: cover; background: #fff;}
        .info-adv { flex: 1; }
        .info-adv h4 { color: #2a2a2a; margin-bottom: 3px; text-transform: uppercase; font-size: 0.9em; }
        .info-adv p { font-size: 0.75em; color: #5a4231; font-weight: bold; }
        
        .btn-desafiar { background-color: #d27d46; color: white; border: 2px solid #5a4231; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0px 3px 0px #5a4231; }
        .btn-desafiar:active { box-shadow: 0px 0px 0px #5a4231; transform: translateY(3px); }
        .btn-ficar-online { background-color: #4CAF50; color: white; border: 2px solid #2E7D32; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0px 4px 0px #2E7D32; width: 100%; text-transform: uppercase; margin-bottom: 15px; flex-shrink: 0;}

        /* O PALCO DA BATALHA */
        #telaBatalha { display: none; flex-direction: column; height: 100%; background: url('imagens/fundoarena.png') center/cover; position: relative; z-index: 3;}
        
        .barra-controles { background: rgba(0,0,0,0.85); padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #dfc495;}
        .btn-speed { background: #5a4231; color: #dfc495; border: 1px solid #dfc495; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-speed.ativo { background: #d27d46; color: white; }
        .btn-pular { background: #cc3333; color: white; border: 1px solid #ff9999; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .lutadores-area { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 20px 10px; position: relative; }
        .lutador-box { display: flex; flex-direction: column; align-items: center; width: 48%; position: relative; }
        .sprite-gato { width: 110px; height: 110px; object-fit: contain; transition: all 0.3s ease; position: relative; z-index: 10;}
        
        .status-batalha { width: 100%; background: #2c2c2c; border: 2px solid #dfc495; border-radius: 6px; padding: 5px; margin-top: 5px; }
        .nome-lutador { color: #f1ddb0; font-size: 0.75em; text-align: center; margin-bottom: 5px; font-weight: bold; text-transform: uppercase;}
        .bar-wrap { width: 100%; background: #000; height: 10px; border-radius: 4px; border: 1px solid #5a4231; overflow: hidden; margin-bottom: 3px; position: relative; }
        .fill-hp { height: 100%; background: #cc3333; width: 100%; transition: width 0.3s; }
        .fill-pa { height: 100%; background: #3399ff; width: 0%; transition: width 0.3s; }
        .text-bar { position: absolute; top: 0; width: 100%; text-align: center; font-size: 0.6em; color: white; line-height: 10px; font-weight: bold; }

        .area-slots { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; }
        .slot-hab { 
            background: #4a3b32; border: 1px solid #dfc495; border-radius: 4px; 
            padding: 4px; text-align: center; font-size: 0.55em; color: #f1ddb0; 
            font-weight: bold; position: relative; height: 35px; display: flex; 
            align-items: center; justify-content: center; overflow: hidden; transition: all 0.2s ease;
        }
        .slot-mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; font-size: 2em; color: white; z-index: 2; opacity: 0; pointer-events: none; }
        .slot-mask.ativo { opacity: 1; }
        .slot-hab.usando { background: #d27d46; color: white; transform: scale(1.1); box-shadow: 0 0 10px #ffbb00; z-index: 5;}

        /* ANIMAÇÕES VISUAIS */
        @keyframes animAtaqueEsq { 0% { transform: translateX(0); } 50% { transform: translateX(40px) scale(1.1); z-index: 20;} 100% { transform: translateX(0); } }
        @keyframes animAtaqueDir { 0% { transform: translateX(0); } 50% { transform: translateX(-40px) scale(1.1); z-index: 20;} 100% { transform: translateX(0); } }
        @keyframes animDano { 0% { filter: brightness(1); transform: translateX(0); } 20% { filter: brightness(0.3) sepia(1) hue-rotate(-50deg) saturate(5); transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-5px); } 100% { filter: brightness(1); transform: translateX(0); } }
        @keyframes animEsquiva { 0% { transform: translateX(0); opacity: 1; } 50% { transform: translateX(-30px); opacity: 0.5; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes fadeUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(1.5); } }

        .atacando-esq { animation: animAtaqueEsq 0.3s ease forwards; }
        .atacando-dir { animation: animAtaqueDir 0.3s ease forwards; }
        .tomando-dano { animation: animDano 0.3s ease forwards; }
        .esquivando { animation: animEsquiva 0.4s ease forwards; }
        .dano-flutuante { position: absolute; color: #ff4444; font-weight: bold; font-size: 1.5em; text-shadow: 2px 2px 0 #000; animation: fadeUp 1s forwards; pointer-events: none; z-index: 100;}
        .critico-flutuante { color: #ffbb00; font-size: 1.8em; text-transform: uppercase; }
        .esquiva-flutuante { color: #aaa; font-size: 1.2em; font-style: italic; }

        /* MODAIS GERAIS */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .painel-modal { background: #dfc495; border: 3px solid #5a4231; border-radius: 12px; width: 90%; max-height: 80vh; padding: 20px; overflow-y: auto; text-align: center; }
        .btn-fechar { background: #cc3333; color: white; border: none; padding: 5px 10px; border-radius: 5px; float: right; font-weight: bold; cursor: pointer; }
        
        .modal-centro { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.85); z-index: 4000; display: none; justify-content: center; align-items: center; }
        .painel-centro { background: #f1ddb0; width: 85%; max-width: 320px; border: 3px solid #5a4231; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0px 10px 20px rgba(0,0,0,0.5); }
        .botoes-centro { display: flex; gap: 10px; justify-content: center; margin-top: 15px;}
        .btn-centro { flex: 1; padding: 10px; background: #dfc495; border: 2px solid #5a4231; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0px 3px 0px #5a4231; color: #2a2a2a; text-transform: uppercase; }
        .btn-centro:active { box-shadow: 0px 0px 0px #5a4231; transform: translateY(3px); }
        .btn-centro.cancelar { background: transparent; border: 2px dashed #a68a61; box-shadow: none; }

        /* MODAL DE HISTÓRIA */
        #modalHistoria { z-index: 3000; flex-direction: column; background: #1a1a1a; padding: 0; justify-content: flex-start; }
        #historiaImg { width: 100%; height: 50%; background-size: cover; background-position: center; background-repeat: no-repeat; border-bottom: 4px solid #5a4231; }
        .caixa-texto-historia { flex: 1; width: 100%; padding: 20px; box-sizing: border-box; position: relative; background-color: #2c2c2c; overflow-y: auto;}
        #historiaTexto { color: #f1ddb0; font-size: 1.05em; font-family: 'Courier New', Courier, monospace; font-weight: bold; line-height: 1.5em; text-shadow: 1px 1px 2px #000; white-space: pre-wrap;}
        #btnPularHistoria { position: absolute; bottom: 20px; right: 20px; background-color: #d27d46; color: white; border: 2px solid #5a4231; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0px 3px 0px #5a4231; text-transform: uppercase; z-index: 10;}
        #btnPularHistoria:active { box-shadow: 0px 0px 0px #5a4231; transform: translateY(3px); }

        #toastContainer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-msg { background-color: #2c2c2c; color: #f1ddb0; padding: 12px 24px; border: 2px solid #dfc495; border-radius: 8px; font-weight: bold; text-align: center; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); animation: fadeInOut 2s forwards; text-transform: uppercase; font-size: 0.85em; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(-10px); } 10% { opacity: 1; transform: translateY(0); } 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }

    </style>
</head>
<body onclick="tocarMusicaArena()">
    <audio id="bgmArena" loop src="audios/arena.mp3"></audio>

    <div id="toastContainer"></div>
    
    <div class="modal-centro" id="modalConfirmacao">
        <div class="painel-centro">
            <p id="textoConfirmacao" style="color: #2a2a2a; font-weight: bold; font-size: 1.05em;"></p>
            <div class="botoes-centro">
                <button class="btn-centro cancelar" id="btnCancelarConfirm">Cancelar</button>
                <button class="btn-centro" id="btnAceitarConfirm">Sim, Pular</button>
            </div>
        </div>
    </div>

    <div class="modal" id="modalHistoria">
        <div id="historiaImg"></div>
        <div class="caixa-texto-historia">
            <p id="historiaTexto"></p>
            <button id="btnPularHistoria">Pular >></button>
        </div>
    </div>

    <div id="app">
        <div class="conteudo-app" id="telaLobby">
            <header>ARENA CATDOJO</header>
            
            <div class="abas-arena">
                <div class="aba ativa" onclick="mudarAba('pve')">Desafios</div>
                <div class="aba" onclick="mudarAba('pvp')">PvP</div>
            </div>

            <div id="aba-pve" class="lista-container ativa">
                <div id="vistaClas">
                    </div>

                <div id="vistaNpcs" style="display: none; flex-direction: column; gap: 10px;">
                    <button onclick="voltarParaClas()" style="padding: 8px; background: #5a4231; color: #dfc495; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 10px;">&larr; Voltar aos Clãs</button>
                    <div id="listaInimigosHtml"></div>
                </div>
            </div>

            <div id="aba-pvp" class="lista-container">
                <button class="btn-ficar-online" id="btnFicarOnline">Entrar na Fila PvP</button>
                <div id="listaJogadoresOnline" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>

            <nav>
                <div class="nav-item" onclick="window.location.href='dojo.html'"><img src="icones/Dojo.png" alt="Dojo">DOJO</div>
                <div class="nav-item" onclick="window.location.href='dormitorio.html'"><img src="icones/descanso.png" alt="Dormitório">DORM</div>
                <div class="nav-item"><img src="icones/arena.png" alt="Arena">ARENA</div>
            </nav>
        </div>

        <div id="telaBatalha">
            <div class="barra-controles">
                <span id="txtTurno" style="color: white; font-weight: bold;">Turno: 1</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-speed ativo" id="btnSpd1" onclick="mudarVelocidade(1)">1x</button>
                    <button class="btn-speed" id="btnSpd2" onclick="mudarVelocidade(2)">2x</button>
                    <button class="btn-pular" onclick="pularBatalha=true">PULAR &raquo;</button>
                </div>
            </div>
            
            <div class="lutadores-area">
                <div class="lutador-box" id="boxLutador1">
                    <img src="" class="sprite-gato" id="imgLutador1">
                    <div class="status-batalha">
                        <div class="nome-lutador" id="nomeLutador1">Meu Gato</div>
                        <div class="bar-wrap"><div class="fill-hp" id="hpLutador1"></div><span class="text-bar" id="txtHp1"></span></div>
                        <div class="bar-wrap"><div class="fill-pa" id="paLutador1"></div><span class="text-bar" id="txtPa1"></span></div>
                        <div class="area-slots" id="slotsLutador1"></div>
                    </div>
                </div>

                <div style="font-size: 1.5em; font-weight: bold; color: #dfc495; text-shadow: 2px 2px #000; position: absolute; left: 50%; top: 30%; transform: translateX(-50%);">VS</div>

                <div class="lutador-box" id="boxLutador2">
                    <img src="" class="sprite-gato" id="imgLutador2" style="transform: scaleX(-1);">
                    <div class="status-batalha">
                        <div class="nome-lutador" id="nomeLutador2">Adversário</div>
                        <div class="bar-wrap"><div class="fill-hp" id="hpLutador2"></div><span class="text-bar" id="txtHp2"></span></div>
                        <div class="bar-wrap"><div class="fill-pa" id="paLutador2"></div><span class="text-bar" id="txtPa2"></span></div>
                        <div class="area-slots" id="slotsLutador2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="modalSeletor">
        <div class="painel-modal">
            <button class="btn-fechar" onclick="cancelarSelecao()">X</button>
            <h3 style="color: #2a2a2a; margin-bottom: 15px; text-transform: uppercase;">Escolha seu Campeão</h3>
            <div id="listaMeusGatos" style="display: flex; flex-direction: column; gap: 10px; text-align: left;"></div>
        </div>
    </div>

    <div class="modal" id="modalRelatorio">
        <div class="painel-modal">
            <h2 id="tituloRelatorio" style="text-transform: uppercase; margin-bottom: 5px;">RESULTADO</h2>
            <p id="subRelatorio" style="color: #5a4231; font-weight: bold; font-size: 0.9em;"></p>
            
            <div style="background: #f1ddb0; border: 2px solid #5a4231; border-radius: 8px; padding: 15px; margin-top: 15px; text-align: left;">
                <p style="margin-bottom: 8px; font-weight: bold; color: #4a3b32;">HP Perdido: <span id="relHp" style="color:#2a2a2a;"></span></p>
                <p style="margin-bottom: 8px; font-weight: bold; color: #4a3b32;">XP Recebido: <span id="relXp" style="color: #3399ff;"></span></p>
                <p style="margin-bottom: 8px; font-weight: bold; color: #4a3b32;">Moedas: <span id="relMoedas" style="color: #d27d46;"></span></p>
                <p style="margin-bottom: 8px; font-weight: bold; color: #4a3b32;">Reputação: <span id="relRep" style="color: #4CAF50;"></span></p>
            </div>
            
            <button onclick="window.location.reload()" style="background-color: #d27d46; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1.1em;">Voltar ao Dojo</button>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDocs, collection, doc, updateDoc, getDoc, setDoc, deleteDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        import { LISTA_NPCS } from './npcs.js';
        import { ARTES_MARCIAIS } from './artes-marciais.js';
        // IMPORTANTE: Puxando o roteiro externo das cenas para não poluir este arquivo
        import { HISTORIAS_ARENA } from './historia-arena.js'; 
        
        let jogadorUid = null;
        let claNome = "Mestre";
        let reputacaoAtual = 0; 
        let meusGatos = [];
        let npcsDerrotados = []; 
        let treinosAtivos = [];
        
        let velMult = 1;
        window.pularBatalha = false;
        
        let salaAtiva = null;
        let isHost = false;
        let unsubscribeSala = null;
        let unsubscribeListaPvP = null;
        let inimigoPveAtual = null;
        
        let typingInterval = null;
        let historiaCompletada = false;

        // Toca Música Global
        window.tocarMusicaArena = () => {
            const bgm = document.getElementById('bgmArena');
            if (bgm.paused) {
                bgm.volume = 0.4;
                bgm.play().catch(e => console.log("Áudio bloqueado até interação."));
            }
        };

        window.mostrarToast = (mensagem) => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div'); toast.className = 'toast-msg'; toast.textContent = mensagem;
            container.appendChild(toast); setTimeout(() => toast.remove(), 2500);
        };

        function pedirConfirmacao(mensagem, callback) {
            document.getElementById('textoConfirmacao').textContent = mensagem;
            document.getElementById('modalConfirmacao').style.display = 'flex';
            document.getElementById('btnAceitarConfirm').onclick = () => { document.getElementById('modalConfirmacao').style.display = 'none'; callback(); };
            document.getElementById('btnCancelarConfirm').onclick = () => { document.getElementById('modalConfirmacao').style.display = 'none'; };
        }

        // ==========================================
        // FLUXO DE HISTÓRIA (Visual Novel)
        // ==========================================
        function iniciarHistoria(npcId, tipo) {
            return new Promise((resolve) => {
                // Checa se o NPC tem história antes ou depois, puxando do arquivo externo
                if (!HISTORIAS_ARENA || !HISTORIAS_ARENA[npcId] || !HISTORIAS_ARENA[npcId][tipo]) { 
                    resolve(); return; 
                } 

                const cenaImg = HISTORIAS_ARENA[npcId][tipo].cena;
                const textoCompleto = HISTORIAS_ARENA[npcId][tipo].texto;

                document.getElementById('historiaImg').style.backgroundImage = `url('${cenaImg}')`;
                document.getElementById('historiaTexto').textContent = '';
                document.getElementById('modalHistoria').style.display = 'flex';
                
                let charIndex = 0;
                historiaCompletada = false;
                if (typingInterval) clearInterval(typingInterval);

                const btnPular = document.getElementById('btnPularHistoria');
                btnPular.textContent = "PULAR >>";

                // Efeito máquina de escrever
                typingInterval = setInterval(() => {
                    document.getElementById('historiaTexto').textContent += textoCompleto.charAt(charIndex);
                    charIndex++;
                    // Faz a rolagem automática acompanhar o texto
                    const caixa = document.querySelector('.caixa-texto-historia');
                    caixa.scrollTop = caixa.scrollHeight;

                    if (charIndex >= textoCompleto.length) {
                        clearInterval(typingInterval);
                        historiaCompletada = true;
                        btnPular.textContent = "AVANÇAR >>";
                    }
                }, 30);

                btnPular.onclick = () => {
                    if (historiaCompletada) {
                        document.getElementById('modalHistoria').style.display = 'none';
                        resolve();
                    } else {
                        pedirConfirmacao("Você quer mesmo pular a história?", () => {
                            clearInterval(typingInterval);
                            historiaCompletada = true;
                            document.getElementById('modalHistoria').style.display = 'none';
                            resolve();
                        });
                    }
                };
            });
        }

        // ==========================================
        // 1. CONTROLES DE INTERFACE
        // ==========================================
        window.mudarAba = (aba) => {
            tocarMusicaArena();
            document.querySelectorAll('.aba').forEach(el => el.classList.remove('ativa'));
            document.querySelectorAll('.lista-container').forEach(el => el.classList.remove('ativa'));
            event.target.classList.add('ativa');
            document.getElementById(`aba-${aba}`).classList.add('ativa');
        };

        window.abrirListaNpcs = (nomeDoCla) => {
            tocarMusicaArena();
            document.getElementById('vistaClas').style.display = 'none';
            document.getElementById('vistaNpcs').style.display = 'flex';
            carregarListaNpcs(nomeDoCla); 
        };
        
        window.voltarParaClas = () => {
            document.getElementById('vistaNpcs').style.display = 'none';
            document.getElementById('vistaClas').style.display = 'block';
        };

        window.mudarVelocidade = (v) => {
            velMult = v;
            document.querySelectorAll('.btn-speed').forEach(btn => btn.classList.remove('ativo'));
            document.getElementById(`btnSpd${v}`).classList.add('ativo');
        };

        async function waitFast(ms) { if (!window.pularBatalha) await new Promise(r => setTimeout(r, ms / velMult)); }

        window.cancelarSelecao = async () => {
            document.getElementById('modalSeletor').style.display = 'none';
            if (salaAtiva) {
                await deleteDoc(doc(db, "ArenaLive", salaAtiva));
                salaAtiva = null;
                if(unsubscribeSala) unsubscribeSala();
                document.getElementById('btnFicarOnline').textContent = "Entrar na Fila PvP";
                document.getElementById('btnFicarOnline').disabled = false;
                document.getElementById('btnFicarOnline').style.backgroundColor = "#4CAF50";
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                jogadorUid = user.uid;

        // ==========================================
        // 3. MOTOR MATEMÁTICO (Mantido Intacto)
        // ==========================================
        function rolarDado(chance) { return (Math.random() * 100) <= chance; }

        function prepararLutador(dados, isCpu = false) {
            const res = dados.resistencia || dados.atributos?.resistencia || 1;
            const vig = dados.vigor || dados.atributos?.vigor || 1;
            const forca = dados.forca || dados.atributos?.forca || 1;
            const agi = dados.agilidade || dados.atributos?.agilidade || 1;
            const foco = dados.foco || dados.atributos?.foco || 1;
            
            const hpMax = isCpu ? dados.hpMax || (250 + (res * 15)) : dados.hpMax;
            let habilidades = dados.habilidadesEquipadas || [];
            
            return {
                id: dados.id, nome: dados.nome, foto: dados.foto, isCpu: isCpu, cpuId: dados.id,
                hpAtual: isCpu ? hpMax : dados.hpAtual, hpMax: hpMax, hpInicial: isCpu ? hpMax : dados.hpAtual,
                faixa: dados.faixa || (isCpu ? dados.faixa : 1),
                paAtual: 0, paMax: 100 + Math.floor(vig / 2), recargaPA: 5 + Math.floor(vig / 4),
                ataqueBruto: forca * 2.5, resistencia: res, agilidade: agi, foco: foco,
                esquivaPct: (agi / (agi + 100)) * 100, criticoPct: (foco / (foco + 100)) * 100,
                habilidadesEquipadas: habilidades, cooldowns: {}, 
                tecnicaPadrao: { nome: "Arranhão Básico", custo_pa: 0, danoPct: 80, geraPa: 15, tipo: "Ataque" }
            };
        }

        function buscarDadosDaTecnica(nomeTecnica) {
            for (const estilo in ARTES_MARCIAIS) {
                const tecnicaEncontrada = ARTES_MARCIAIS[estilo].tecnicas.find(t => t.nome === nomeTecnica);
                if (tecnicaEncontrada) return tecnicaEncontrada;
            }
            return null;
        }

        function processarGolpeMatematico(atacante, defensor, turno, codLutador) {
            let techEscolhida = null;
            let gerouPa = 0;

            if (atacante.habilidadesEquipadas.length > 0) {
                for (let nomeTecnica of atacante.habilidadesEquipadas) {
                    if (!nomeTecnica) continue; 
                    let nomeString = typeof nomeTecnica === 'object' ? nomeTecnica.nomeTecnica : nomeTecnica;
                    let techDB = buscarDadosDaTecnica(nomeString);
                    if (!techDB) continue;

                    let turnoLiberacao = atacante.cooldowns[techDB.nome] || 0;
                    if (turno < turnoLiberacao) continue; 

                    if (atacante.paAtual >= techDB.custo_pa) { techEscolhida = techDB; break; }
                }
            }
            if (!techEscolhida) techEscolhida = atacante.tecnicaPadrao;

            atacante.paAtual -= (techEscolhida.custo_pa || 0);
            if (techEscolhida === atacante.tecnicaPadrao) gerouPa = techEscolhida.geraPa;
            else if (techEscolhida.desc && techEscolhida.desc.includes("gera 10 PA")) gerouPa = 10;
            else if (techEscolhida.desc && techEscolhida.desc.includes("gera 15 PA")) gerouPa = 15;
            
            atacante.paAtual = Math.min(atacante.paMax, atacante.paAtual + gerouPa);
            if (techEscolhida.recarga > 0) { atacante.cooldowns[techEscolhida.nome] = turno + techEscolhida.recarga + 1; }

            let evadiu = rolarDado(defensor.esquivaPct);
            let critico = false;
            let danoFinal = 0;

            if (!evadiu && techEscolhida.tipo !== "Buff" && techEscolhida.tipo !== "Cura" && techEscolhida.tipo !== "Defesa") {
                let multDefesa = 100 / (100 + defensor.resistencia);
                let matchDano = techEscolhida.desc ? techEscolhida.desc.match(/Causa (\d+)%/) : null;
                let danoPct = matchDano ? parseInt(matchDano[1]) / 100 : 1.0; 

                danoFinal = (atacante.ataqueBruto * danoPct) * multDefesa;
                if (rolarDado(atacante.criticoPct)) { danoFinal *= 1.5; critico = true; }
                danoFinal = Math.max(1, Math.floor(danoFinal));
                defensor.hpAtual = Math.max(0, defensor.hpAtual - danoFinal);
            }

            let estadoCd = {};
            for(let key in atacante.cooldowns) estadoCd[key] = atacante.cooldowns[key];

            return { tipo: "ataque", turno: turno, atacanteCod: codLutador, nomeTecnica: techEscolhida.nome, esquiva: evadiu, critico: critico, dano: danoFinal, hpDefensor: defensor.hpAtual, cooldownsAtualizados: estadoCd };
        }

        function simularMatematicaBatalha(l1, l2) {
            let roteiro = [];
            let turno = 1;
            while (l1.hpAtual > 0 && l2.hpAtual > 0 && turno < 100) { 
                let acaoL1 = processarGolpeMatematico(l1, l2, turno, 'A');
                roteiro.push(acaoL1);
                if (l2.hpAtual <= 0) break;
                let acaoL2 = processarGolpeMatematico(l2, l1, turno, 'B');
                roteiro.push(acaoL2);
                if (l1.hpAtual <= 0) break;

                l1.paAtual = Math.min(l1.paMax, l1.paAtual + l1.recargaPA);
                l2.paAtual = Math.min(l2.paMax, l2.paAtual + l2.recargaPA);
                roteiro.push({ tipo: "fimTurno", turno: turno, paL1: l1.paAtual, paL2: l2.paAtual });
                turno++;
            }
            return roteiro;
        }

        // ==========================================
        // 4. REPRODUTOR VISUAL
        // ==========================================
        function criarUiSlots(lado, lutador) {
            const container = document.getElementById(`slotsLutador${lado}`);
            container.innerHTML = '';
            let arr = lutador.habilidadesEquipadas.length > 0 ? lutador.habilidadesEquipadas : [lutador.tecnicaPadrao.nome];
            arr.forEach((nomeHab, idx) => {
                let nomeString = typeof nomeHab === 'object' ? nomeHab.nomeTecnica : nomeHab;
                let idSlot = `slot_${lado}_${idx}`;
                let el = document.createElement('div');
                el.className = 'slot-hab'; el.id = idSlot; el.setAttribute('data-nome', nomeString);
                el.innerHTML = `<span>${nomeString}</span><div class="slot-mask" id="mask_${idSlot}"></div>`;
                container.appendChild(el);
            });
        }

        function atualizarSlots(lado, cooldownsNoTurno, turnoAtual) {
            const container = document.getElementById(`slotsLutador${lado}`);
            container.querySelectorAll('.slot-hab').forEach(slot => {
                let nomeHab = slot.getAttribute('data-nome');
                let mask = slot.querySelector('.slot-mask');
                let turnoLivre = cooldownsNoTurno[nomeHab] || 0;
                let falta = turnoLivre - turnoAtual;
                if (falta > 0) { mask.textContent = falta; mask.classList.add('ativo'); } 
                else { mask.classList.remove('ativo'); }
            });
        }

        function piscarSlot(lado, nomeHab) {
            document.getElementById(`slotsLutador${lado}`).querySelectorAll('.slot-hab').forEach(slot => {
                if (slot.getAttribute('data-nome') === nomeHab) {
                    slot.classList.add('usando'); setTimeout(() => slot.classList.remove('usando'), 600 / velMult);
                }
            });
        }

        function atualizarHUD(lado, lutador) {
            document.getElementById(`hpLutador${lado}`).style.width = `${(lutador.hpAtual / lutador.hpMax) * 100}%`;
            document.getElementById(`txtHp${lado}`).textContent = `${Math.round(lutador.hpAtual)} / ${lutador.hpMax}`;
            document.getElementById(`paLutador${lado}`).style.width = `${(lutador.paAtual / lutador.paMax) * 100}%`;
            document.getElementById(`txtPa${lado}`).textContent = `${Math.round(lutador.paAtual)} PA`;
        }

        function animarTextoFlutuante(lado, texto, classe) {
            const span = document.createElement('span'); span.className = `dano-flutuante ${classe}`; span.textContent = texto;
            span.style.top = `${Math.random() * 40 + 20}%`; span.style.left = `${Math.random() * 40 + 20}%`;
            document.getElementById(`boxLutador${lado}`).appendChild(span);
            setTimeout(() => span.remove(), 1000);
        }

        async function reproduzirRoteiroBatalha(meuGato, inimigoGato, roteiro, salaIdParaDeletar = null) {
            document.getElementById('imgLutador1').src = meuGato.foto;
            document.getElementById('nomeLutador1').textContent = meuGato.nome;
            document.getElementById('imgLutador2').src = inimigoGato.foto;
            document.getElementById('nomeLutador2').textContent = inimigoGato.nome;

            let codMeuLado = isHost ? 'A' : 'B'; 
            if(salaIdParaDeletar === null) codMeuLado = 'A'; 

            atualizarHUD(1, meuGato); atualizarHUD(2, inimigoGato);
            criarUiSlots(1, meuGato); criarUiSlots(2, inimigoGato);
            await waitFast(800);

            for (const acao of roteiro) {
                if (window.pularBatalha) {
                    if (acao.tipo === "fimTurno") {
                        meuGato.paAtual = codMeuLado === 'A' ? acao.paL1 : acao.paL2;
                        inimigoGato.paAtual = codMeuLado === 'A' ? acao.paL2 : acao.paL1;
                    } else if (acao.tipo === "ataque") {
                        let objDefensor = (acao.atacanteCod === codMeuLado) ? inimigoGato : meuGato;
                        objDefensor.hpAtual = acao.hpDefensor;
                    }
                    continue; 
                }

                if (acao.tipo === "fimTurno") {
                    document.getElementById('txtTurno').textContent = `Turno: ${acao.turno + 1}`;
                    meuGato.paAtual = codMeuLado === 'A' ? acao.paL1 : acao.paL2;
                    inimigoGato.paAtual = codMeuLado === 'A' ? acao.paL2 : acao.paL1;
                    atualizarHUD(1, meuGato); atualizarHUD(2, inimigoGato);
                    await waitFast(400); continue;
                }

                if (acao.tipo === "ataque") {
                    let idAtacante = (acao.atacanteCod === codMeuLado) ? 1 : 2;
                    let idDefensor = (idAtacante === 1) ? 2 : 1;
                    let objAtacante = idAtacante === 1 ? meuGato : inimigoGato;
                    let objDefensor = idDefensor === 1 ? meuGato : inimigoGato;

                    piscarSlot(idAtacante, acao.nomeTecnica);
                    atualizarSlots(idAtacante, acao.cooldownsAtualizados, acao.turno);

                    const animClass = idAtacante === 1 ? 'atacando-esq' : 'atacando-dir';
                    const imgAtk = document.getElementById(`imgLutador${idAtacante}`);
                    imgAtk.classList.add(animClass);
                    await waitFast(250); 

                    if (acao.esquiva) {
                        const imgDef = document.getElementById(`imgLutador${idDefensor}`);
                        imgDef.classList.add('esquivando');
                        animarTextoFlutuante(idDefensor, "Esquivou!", "esquiva-flutuante");
                        setTimeout(() => imgDef.classList.remove('esquivando'), 400);
                    } else if (acao.dano > 0) {
                        objDefensor.hpAtual = acao.hpDefensor;
                        const imgDef = document.getElementById(`imgLutador${idDefensor}`);
                        imgDef.classList.add('tomando-dano');
                        setTimeout(() => imgDef.classList.remove('tomando-dano'), 300);
                        
                        if (acao.critico) animarTextoFlutuante(idDefensor, `-${acao.dano} CRÍTICO!`, "critico-flutuante");
                        else animarTextoFlutuante(idDefensor, `-${acao.dano}`, "");
                    }

                    setTimeout(() => imgAtk.classList.remove(animClass), 200);
                    atualizarHUD(idAtacante, objAtacante); atualizarHUD(idDefensor, objDefensor);
                    await waitFast(600);
                }
            }

            if (window.pularBatalha) { atualizarHUD(1, meuGato); atualizarHUD(2, inimigoGato); }
            await waitFast(1000);
            
            if (salaIdParaDeletar && isHost) await deleteDoc(doc(db, "ArenaLive", salaIdParaDeletar));

            const venci = meuGato.hpAtual > 0;
            
            if (salaIdParaDeletar === null) {
                // Roda a história Pós-Luta apenas se ele ganhar a luta!
                if (venci) {
                    await iniciarHistoria(inimigoGato.cpuId, 'post');
                }
                // Processa o banco de dados e abre a tela de recompensas/perdas
                await aplicarRecompensasPvE(meuGato, inimigoGato, venci);
            } else {
                alert(venci ? "VITÓRIA NO PVP!" : "DERROTA NO PVP!");
                window.location.reload();
            }
        }

        async function iniciarBatalhaPvE(gatoPlayerRaw, npcRaw) {
            window.pularBatalha = false;
            document.getElementById('telaLobby').style.display = 'none';
            document.getElementById('telaBatalha').style.display = 'flex';

            let l1 = prepararLutador(gatoPlayerRaw, false);
            let l2 = prepararLutador(npcRaw, true);

            const roteiro = simularMatematicaBatalha(l1, l2);
            await reproduzirRoteiroBatalha(l1, l2, roteiro, null);
        }

        async function aplicarRecompensasPvE(meuLutadorProcessado, inimigoGato, venceu) {
            const gatoRef = doc(db, "Clas", jogadorUid, "Gatos", meuLutadorProcessado.id);
            const claRef = doc(db, "Clas", jogadorUid);
            const claSnap = await getDoc(claRef);
            let claData = claSnap.data();

            // PUNIÇÃO ÚNICA: O gato só é atualizado com o HP que restou da batalha!
            let updatesGato = { hpAtual: meuLutadorProcessado.hpAtual };
            let xpGanho = 0, moedasGanhas = 0, repGanha = 0;
            
            if (venceu) {
                let vigor = meuLutadorProcessado.vigor || 1;
                let foco = meuLutadorProcessado.foco || 1;
                let nivelInimigo = inimigoGato.faixa || 1;
                
                const npcOriginal = LISTA_NPCS.find(n => n.id === inimigoGato.cpuId);
                
                if (npcOriginal && npcOriginal.isBoss) {
                    xpGanho = Math.floor(npcOriginal.xpBoss * (1 + (vigor / 100)));
                    moedasGanhas = npcOriginal.moedasBoss;
                    repGanha = npcOriginal.repBoss; 
                } else {
                    xpGanho = Math.floor((15 + (nivelInimigo * 5)) * (1 + (vigor / 100)));
                    moedasGanhas = Math.floor((10 + (nivelInimigo * 2)) * (1 + (foco / 100)));
                    repGanha = 2 + Math.floor(nivelInimigo / 4);
                }

                updatesGato.xpAtual = (meuLutadorProcessado.xpAtual || 0) + xpGanho;
                
                await updateDoc(claRef, { 
                    moedas: (claData.moedas || 0) + moedasGanhas,
                    reputacao: Math.min(500, (claData.reputacao || 0) + repGanha),
                    npcsDerrotados: arrayUnion(inimigoGato.cpuId)
                });
            }

            // Gerencia se ele desmaiou (HP 0) ou se sobreviveu
            let hpPerdidoFormat = Math.round(meuLutadorProcessado.hpInicial - meuLutadorProcessado.hpAtual);
            if (meuLutadorProcessado.hpAtual <= 0) {
                updatesGato.estado = "Doente"; // Caiu, vai pra enfermaria
                updatesGato.doenteDesde = Date.now();
            } else if (meuLutadorProcessado.hpAtual < meuLutadorProcessado.hpMax && updatesGato.estado !== 'Em Missão') {
                updatesGato.estado = "Descansando";
                updatesGato.ultimaAtualizacao = Date.now();
            }
            await updateDoc(gatoRef, updatesGato);

            document.getElementById('tituloRelatorio').textContent = venceu ? "VITÓRIA!" : "DERROTA";
            document.getElementById('tituloRelatorio').style.color = venceu ? "#4CAF50" : "#cc3333";
            document.getElementById('subRelatorio').textContent = venceu ? "Seu gato superou o desafio." : "Seu gato foi enviado à enfermaria.";
            
            document.getElementById('relHp').textContent = `-${hpPerdidoFormat}`;
            document.getElementById('relXp').textContent = venceu ? `+${xpGanho}` : "0";
            document.getElementById('relMoedas').textContent = venceu ? `+${moedasGanhas}` : "0";
            document.getElementById('relRep').textContent = venceu ? `+${repGanha}` : "0";

            document.getElementById('modalRelatorio').style.display = 'flex';
        }

        // ==========================================
        // 5. PVP LOBBY (Mantido igual)
        // ==========================================
        document.getElementById('btnFicarOnline').onclick = async () => {
            const btn = document.getElementById('btnFicarOnline');
            btn.textContent = "Aguardando Oponentes...";
            btn.disabled = true;
            btn.style.backgroundColor = "#7b7b7b";

            salaAtiva = jogadorUid;
            isHost = true;
            
            await setDoc(doc(db, "ArenaLive", jogadorUid), {
                hostId: jogadorUid, hostName: claNome, status: 'waiting', guestId: null, guestName: null, hostCat: null, guestCat: null, roteiro: null
            });
            escutarMinhaSala(jogadorUid);
        };

        function escutarListaPvP() {
            unsubscribeListaPvP = onSnapshot(collection(db, "ArenaLive"), (snapshot) => {
                const listaDiv = document.getElementById('listaJogadoresOnline');
                listaDiv.innerHTML = '';
                snapshot.forEach(docSnap => {
                    const sala = docSnap.data();
                    if (sala.status === 'waiting' && sala.hostId !== jogadorUid) {
                        const card = document.createElement('div');
                        card.className = 'card-adv';
                        card.innerHTML = `<div class="info-adv"><h4>Clã: ${sala.hostName}</h4><p>Buscando Batalha</p></div><button class="btn-desafiar">Desafiar</button>`;
                        card.querySelector('button').onclick = () => desafiarJogador(sala.hostId);
                        listaDiv.appendChild(card);
                    }
                });
            });
        }

        async function desafiarJogador(hostId) {
            isHost = false;
            salaAtiva = hostId;
            await updateDoc(doc(db, "ArenaLive", hostId), { status: 'selecting', guestId: jogadorUid, guestName: claNome });
            escutarMinhaSala(hostId);
        }

        function escutarMinhaSala(salaId) {
            if(unsubscribeSala) unsubscribeSala();
            
            unsubscribeSala = onSnapshot(doc(db, "ArenaLive", salaId), async (docSnap) => {
                if (!docSnap.exists()) {
                    if (document.getElementById('telaBatalha').style.display !== 'flex') {
                        alert("O adversário fechou a sala!"); window.location.reload();
                    }
                    return;
                }
                const sala = docSnap.data();

                if (sala.status === 'selecting' && document.getElementById('modalSeletor').style.display === 'none') {
                    const qualCatFalta = isHost ? sala.hostCat : sala.guestCat;
                    if (!qualCatFalta) abrirSeletorGato(false); 
                }

                if (sala.status === 'selecting' && sala.hostCat && sala.guestCat && isHost) {
                    await updateDoc(doc(db, "ArenaLive", salaId), { status: 'calculando' });
                    const roteiro = simularMatematicaBatalha(sala.hostCat, sala.guestCat);
                    await updateDoc(doc(db, "ArenaLive", salaId), { status: 'fighting', roteiro: roteiro });
                }

                if (sala.status === 'fighting' && sala.roteiro) {
                    window.pularBatalha = false;
                    if(unsubscribeSala) unsubscribeSala(); 
                    document.getElementById('telaLobby').style.display = 'none';
                    document.getElementById('telaBatalha').style.display = 'flex';
                    const meuLutador = isHost ? sala.hostCat : sala.guestCat;
                    const inimigoLutador = isHost ? sala.guestCat : sala.hostCat;
                    reproduzirRoteiroBatalha(meuLutador, inimigoLutador, sala.roteiro, salaId);
                }
            });
        }

        async function selecionarGatoPvP(meuGato) {
            const catPreparado = prepararLutador(meuGato, false);
            const campo = isHost ? 'hostCat' : 'guestCat';
            await updateDoc(doc(db, "ArenaLive", salaAtiva), { [campo]: catPreparado });
            document.getElementById('telaLobby').innerHTML = `<h3 style="color:#dfc495; text-align:center; margin-top:50px;">Aguardando o oponente escolher o gato...</h3>`;
        }
    </script>
</body>
