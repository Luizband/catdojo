<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatDojo - Principal</title>
    <style>
        /* RESET BÁSICO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        /* CONTAINER PRINCIPAL COM O FUNDO */
        #app {
            width: 100%;
            max-width: 414px;
            height: 100%;
            position: relative;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            
            /* Aplicando a imagem de fundo */
            background-image: url('fundo.png');
            background-size: cover;
            background-position: center;
        }

        /* ESCURECENDO O FUNDO */
        #app::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4); /* Escurece 40% */
            z-index: 1; /* Fica acima do fundo, mas abaixo do conteúdo */
        }

        /* Tudo dentro do app precisa ficar acima da camada escura */
        .conteudo-app {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* CABEÇALHO (Estilo Pergaminho) */
        header {
            background-color: #dfc495;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px solid #5a4231;
        }

        .perfil-info {
            display: flex;
            gap: 15px;
            flex: 1;
        }

        .foto-cla {
            width: 70px;
            height: 70px;
            background-color: #7b7b7b;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8em;
            font-weight: bold;
        }

        .dados-cla h2 {
            font-size: 1.1em;
            color: #2a2a2a;
            text-transform: uppercase;
        }

        .dados-cla p {
            font-size: 0.9em;
            color: #2a2a2a;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .economia {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            font-weight: bold;
            color: #4a3b32;
        }

        .economia div {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .economia img {
            width: 20px;
        }

        .botoes-topo {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* BOTÕES DO TOPO (Pílulas de Config/Diário com Efeito 3D) */
        .botoes-topo img {
            width: 40px;
            background-color: #dfc495;
            border: 2px solid #5a4231;
            border-radius: 8px;
            padding: 4px;
            cursor: pointer;
            box-shadow: 0px 3px 0px #5a4231;
            transition: all 0.1s;
        }

        .botoes-topo img:active {
            box-shadow: 0px 0px 0px #5a4231;
            transform: translateY(3px);
        }

        /* ÁREA DOS CARDS */
        main {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Ajustado para dar espaço para a sombra */
        }
        
        /* CARDS PRINCIPAIS (Dormitório, Tatame com textura e 3D) */
        .card {
            background-color: #f1ddb0; 
            border: 3px solid #5a4231;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0px 5px 0px #5a4231, inset 0px 0px 15px rgba(139, 90, 43, 0.1);
        }

        .card:active {
            box-shadow: 0px 0px 0px #5a4231, inset 0px 0px 15px rgba(139, 90, 43, 0.1);
            transform: translateY(5px);
        }

        .card-info h3 {
            font-size: 1.1em;
            text-transform: uppercase;
            color: #2a2a2a;
        }

        .card-info p {
            font-size: 0.9em;
            color: #4a3b32;
            margin-top: 2px;
        }

        .alerta-vermelho {
            color: #b30000 !important;
            font-weight: bold;
            font-size: 0.8em !important;
            margin-top: 5px !important;
        }

        .barra-progresso {
            width: 100%;
            height: 12px;
            background-color: #a68a61;
            border-radius: 5px;
            margin-top: 8px;
            border: 1px solid #5a4231;
            overflow: hidden;
        }
        
        .barra-preenchida {
            width: 30%;
            height: 100%;
            background-color: #d27d46;
        }

        .card-icone img {
            width: 45px;
        }

        /* BARRA DE NAVEGAÇÃO INFERIOR */
        nav {
            background-color: #e5cd9e;
            border-top: 3px solid #5a4231;
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75em;
            font-weight: bold;
            color: #4a3b32;
            cursor: pointer;
        }

        .nav-item img {
            width: 40px;
            margin-bottom: 3px;
        }

        /* Efeito de brilho no menu ativo */
        .nav-item.ativo img {
            filter: drop-shadow(0px 0px 8px #ffeb99);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="conteudo-app">
            
            <header>
                <div class="perfil-info">
                    <div class="foto-cla">FOTO</div>
                    <div class="dados-cla">
                        <h2>CLÃ 'NOME DO CLÃ'</h2>
                        <p>Mestre 'nome do jogador'</p>
                        <div class="economia">
                            <div><img src="icones/moeda.png" alt="Moedas"> 50</div>
                            <div><img src="icones/rep.png" alt="Reputação"> 0/500</div>
                        </div>
                    </div>
                </div>
                <div class="botoes-topo">
                    <img src="icones/config.png" alt="Configurações">
                    <img src="icones/log.png" alt="Diário">
                </div>
            </header>

            <main>
                <div class="card">
                    <div class="card-info">
                        <h3>Dormitório</h3>
                        <p>(3/3 Vagas)</p>
                        <p class="alerta-vermelho">⚠️ 1 GATO DOENTE / 1 GATO COM FOME</p>
                    </div>
                    <div class="card-icone">
                        <img src="icones/dormitorio.png" alt="Dormitório">
                    </div>
                </div>

                <div class="card">
                    <div class="card-info" style="width: 100%;">
                        <h3>Tatame</h3>
                        <p>Tatame Nível 1</p>
                        <p>2 Gatos Treinando</p>
                        <div class="barra-progresso">
                            <div class="barra-preenchida"></div>
                        </div>
                    </div>
                    <div class="card-icone" style="margin-left: 10px;">
                        <img src="icones/treino.png" alt="Tatame">
                    </div>
                </div>

                <div class="card">
                    <div class="card-info">
                        <h3>Quadro de Missões</h3>
                        <p>1 em andamento</p>
                    </div>
                    <div class="card-icone">
                        <img src="icones/missao.png" alt="Missões">
                    </div>
                </div>

                <div class="card">
                    <div class="card-info">
                        <h3>Depósito</h3>
                        <p>Depósito nível 1</p>
                        <p>x itens</p>
                    </div>
                    <div class="card-icone">
                        <img src="icones/deposito.png" alt="Depósito">
                    </div>
                </div>
            </main>

            <nav>
                <div class="nav-item ativo">
                    <img src="icones/Dojo.png" alt="Dojo">
                    DOJO
                </div>
                <div class="nav-item">
                    <img src="icones/adocao.png" alt="Adoção">
                    Adoção
                </div>
                <div class="nav-item">
                    <img src="icones/arena.png" alt="Arena">
                    ARENA
                </div>
                <div class="nav-item">
                    <img src="icones/loja.png" alt="Loja">
                    LOJA
                </div>
            </nav>

        </div>
    </div>
</body>
</html>
