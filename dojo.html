<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CatDojo - Principal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a4231">
    <style>
        /* RESET BÁSICO */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        html, body { 
            background-color: #2c2c2c; 
            display: flex; 
            justify-content: center; 
            /* A TRAVA DEFINITIVA PARA ECRÃS MOBILE */
            position: fixed;
            top: 0; 
            bottom: 0; 
            left: 0; 
            right: 0;
            width: 100%;
            overflow: hidden; 
        }

        /* CONTAINER PRINCIPAL COM O FUNDO */
        #app {
            width: 100%;
            max-width: 414px;
            height: 100%;
            position: relative;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            
            background-image: url('imagens/fundo.png');
            background-size: cover;
            background-position: center;
        }

        /* ESCURECENDO O FUNDO */
        #app::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4); 
            z-index: 1; 
        }

        /* Tudo dentro do app precisa ficar acima da camada escura */
        .conteudo-app {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* CABEÇALHO (Estilo Pergaminho) */
        header {
            background-color: #dfc495;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px solid #5a4231;
            position: relative; /* Crucial para a foto grudar nas bordas dele */
        }
        
        .perfil-info {
            display: flex;
            gap: 15px;
            flex: 1;
        }

        .foto-cla {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 90px; /* Largura exata do quadrado */
            background-color: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
        }

        /* ESTA ERA A REGRA QUE FALTAVA PARA ORGANIZAR AS LETRAS */
        .dados-cla {
            margin-left: 90px; /* Empurra os textos para a direita, respeitando a foto */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .dados-cla h2 {
            font-size: 1.25em; /* Aumentado de 1.1em para 1.25em */
            color: #2a2a2a;
            text-transform: uppercase;
        }

        .dados-cla p {
            font-size: 1.0em; /* Aumentado de 0.9em para 1.0em */
            color: #2a2a2a;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .economia {
            display: flex;
            gap: 15px;
            font-size: 0.95em; /* Aumentado de 0.85em para 0.95em */
            font-weight: bold;
            color: #4a3b32;
        }

        .economia div {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .economia img {
            width: 23px; /* Os ícones acompanham o aumento das fontes, subindo de 20px para 23px */
        }

        .botoes-topo {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* BOTÕES DO TOPO (Efeito 3D) */
        .botoes-topo img {
            width: 40px;
            background-color: #dfc495;
            border: 2px solid #5a4231;
            border-radius: 8px;
            padding: 4px;
            cursor: pointer;
            box-shadow: 0px 3px 0px #5a4231;
            transition: all 0.1s;
        }

        .botoes-topo img:active {
            box-shadow: 0px 0px 0px #5a4231;
            transform: translateY(3px);
        }

        /* ÁREA PRINCIPAL E GRID DE MENU */
        main.area-menu {
            flex: 1;
            padding: 10px 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px 10px; /* 25px vertical para o texto caber sem colar no botão de cima */
            align-content: center; /* Centraliza todo o bloco de botões no meio da tela livre */
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        /* O 5º botão centralizado na última linha */
        .menu-item-full {
            grid-column: span 2;
        }

        .menu-label {
            font-size: 1.05em;
            font-weight: 900;
            color: #f1ddb0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 1px 2px 3px rgba(0,0,0,0.8);
            text-align: center;
        }

        .menu-btn {
            background-color: #dfc495;
            border: 3px solid #5a4231;
            border-radius: 22px; /* Curvatura suave inspirada no Supercards */
            width: 100%;
            max-width: 130px; /* Trava o limite para não virar um botão gigante de tablet */
            aspect-ratio: 1 / 1; /* Força o botão a ser sempre um quadrado perfeito */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 6px 0px #5a4231, inset 0px 0px 15px rgba(139, 90, 43, 0.15);
            position: relative;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .menu-item:active .menu-btn {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px #5a4231, inset 0px 0px 15px rgba(139, 90, 43, 0.15);
        }

        .menu-btn img {
            width: 55%; /* Ocupa metade do quadrado, bem visível */
            height: 55%;
            object-fit: contain;
            filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.4)); 
        }

        /* Badges Flutuantes */
        .badge-alerta {
            position: absolute;
            top: -12px;
            right: -12px;
            background-color: #cc3333;
            color: white;
            font-weight: bold;
            font-size: 0.8em;
            padding: 4px 10px;
            border-radius: 12px;
            border: 2px solid #2a2a2a;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.5);
            z-index: 3;
            white-space: nowrap;
        }
        
        .badge-info {
            background-color: #3399ff; 
        }
        /* BARRA DE NAVEGAÇÃO INFERIOR */
        nav { 
            background-color: #e5cd9e; 
            border-top: 3px solid #5a4231; 
            display: flex; 
            justify-content: space-around; 
            flex-shrink: 0;
            padding: 10px 5px; 
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75em;
            font-weight: bold;
            color: #4a3b32;
            cursor: pointer;
        }

        .nav-item img {
            width: 40px;
            margin-bottom: 3px;
        }

        .nav-item.ativo img {
            filter: drop-shadow(0px 0px 8px #ffeb99);
        }

        /* MODAL SELEÇÃO DE AVATAR */
        .modal-avatar {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.75);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .painel-avatar {
            background-color: #f1ddb0;
            border: 3px solid #5a4231;
            border-radius: 12px;
            width: 85%;
            max-width: 360px;
            padding: 20px;
            text-align: center;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.5), inset 0px 0px 20px rgba(139, 90, 43, 0.15);
        }
        
        .painel-avatar h3 {
            color: #2a2a2a;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 1.1em;
            letter-spacing: 1px;
        }
        
        .grid-avatars {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
            padding: 5px;
        }
        
        .grid-avatars img {
            width: 100%;
            border: 2px solid #a68a61;
            border-radius: 8px;
            cursor: pointer;
            background-color: #fdf5e6;
            transition: transform 0.1s;
        }
        
        .grid-avatars img:active {
            border-color: #5a4231;
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="conteudo-app">
            
            <header>
                <div class="perfil-info">
                    <div class="foto-cla" id="fotoClaContainer">
                        <span id="placeholderFoto">FOTO</span>
                    </div>
                    <div class="dados-cla">
                        <h2 id="exibeNomeCla">CARREGANDO...</h2>
                        <p id="exibeNomeMestre">Mestre...</p>
                        <div class="economia">
                            <div><img src="icones/moeda.png" alt="Moedas"> <span id="exibeMoedas">0</span></div>
                            <div><img src="icones/rep.png" alt="Reputação"> <span id="exibeReputacao">0/500</span></div>
                        </div>
                    </div>
                </div>
                <div class="botoes-topo">
                    <img src="icones/config.png" alt="Configurações">
                    <img src="icones/log.png" alt="Diário">
                </div>
            </header>

            <main class="area-menu">
                
                <div class="menu-item" onclick="window.location.href='dormitorio.html'">
                    <span class="menu-label">Dormitório</span>
                    <div class="menu-btn">
                        <div class="badge-alerta" id="badge-dormitorio" style="display: none;"></div>
                        <img src="icones/dormitorio.png" alt="Dormitório">
                    </div>
                </div>

                <div class="menu-item" onclick="window.location.href='tatame.html'">
                    <span class="menu-label">Tatame</span>
                    <div class="menu-btn">
                        <div class="badge-alerta badge-info" id="badge-tatame" style="display: none;"></div>
                        <img src="icones/treino.png" alt="Tatame">
                    </div>
                </div>

                <div class="menu-item" onclick="window.location.href='missoes.html'">
                    <span class="menu-label">Missões</span>
                    <div class="menu-btn">
                        <div class="badge-alerta badge-info" id="badge-missoes" style="display: none;"></div>
                        <img src="icones/missao.png" alt="Missões">
                    </div>
                </div>

                <div class="menu-item" onclick="window.location.href='deposito.html'">
                    <span class="menu-label">Depósito</span>
                    <div class="menu-btn">
                        <img src="icones/deposito.png" alt="Depósito">
                    </div>
                </div>

                <!-- O 5º botão centralizado na última linha (ocupa 2 colunas) -->
                <div class="menu-item menu-item-full" onclick="window.location.href='enfermaria.html'">
                    <span class="menu-label">Enfermaria</span>
                    <div class="menu-btn">
                        <div class="badge-alerta" id="badge-enfermaria" style="display: none;"></div>
                        <img src="icones/enfermaria.png" alt="Enfermaria">
                    </div>
                </div>

            </main>

            <nav>
                <div class="nav-item ativo">
                    <img src="icones/Dojo.png" alt="Dojo">
                    DOJO
                </div>
                <div class="nav-item" onclick="window.location.href='adocao.html'">
                    <img src="icones/adocao.png" alt="Adoção">
                    Adoção
                </div>
                <div class="nav-item">
                    <img src="icones/arena.png" alt="Arena">
                    ARENA
                </div>
                <div class="nav-item" onclick="window.location.href='loja.html'">
                    <img src="icones/loja.png" alt="Loja">
                    LOJA
                </div>
            </nav>

        </div>
    </div>

    <div id="modalAvatar" class="modal-avatar" style="display: none;">
        <div class="painel-avatar">
            <h3>Escolha o Brasão do Clã</h3>
            <div class="grid-avatars" id="listaAvatars">
                </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDoc, doc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const exibeNomeCla = document.getElementById('exibeNomeCla');
        const exibeNomeMestre = document.getElementById('exibeNomeMestre');
        const exibeMoedas = document.getElementById('exibeMoedas');
        const exibeReputacao = document.getElementById('exibeReputacao');
        const fotoClaContainer = document.getElementById('fotoClaContainer');
        const modalAvatar = document.getElementById('modalAvatar');
        const listaAvatars = document.getElementById('listaAvatars');

        let jogadorUid = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                jogadorUid = user.uid;
                await carregarDadosDoDojo(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });

        async function carregarDadosDoDojo(uid) {
            try {
                const docRef = doc(db, "Clas", uid);
                const docSnap = await getDoc(docRef);

                let countMissoes = 0;
                let countTreinos = 0;

                if (docSnap.exists()) {
                    const dados = docSnap.data();

                    // 1. DADOS DO CABEÇALHO
                    let textoCla = dados.nomeCla ? dados.nomeCla.trim() : "DESCONHECIDO";
                    if (!textoCla.toUpperCase().startsWith("CLÃ") && !textoCla.toUpperCase().startsWith("CLA")) { textoCla = "CLÃ " + textoCla; }
                    exibeNomeCla.textContent = textoCla.toUpperCase();

                    let textoMestre = dados.nomeMestre ? dados.nomeMestre.trim() : "...";
                    if (!textoMestre.toUpperCase().startsWith("MESTRE")) { textoMestre = "Mestre " + textoMestre; }
                    exibeNomeMestre.textContent = textoMestre;

                    exibeMoedas.textContent = dados.moedas !== undefined ? dados.moedas : 50;
                    exibeReputacao.textContent = `${dados.reputacao || 0}/500`;

                    if (dados.avatar) {
                        mostrarAvatarNaTela(dados.avatar);
                    } else {
                        abrirSeletorDeAvatar();
                    }

                    // 2. CONTA MISSÕES E TREINOS ATIVOS
                    const missoesAtivas = dados.missoesAtivas || [];
                    countMissoes = missoesAtivas.length;

                    const treinosAtivos = dados.treinosAtivos || [];
                    treinosAtivos.forEach(t => {
                        countTreinos++; // Conta o aluno
                        if (t.profId) countTreinos++; // Conta o professor, se houver
                    });
                }

                // 3. VARRE OS GATOS PARA CONTAR DOENTES E FAMINTOS
                let countDoentes = 0;
                let countFome = 0;
                
                const gatosRef = collection(db, "Clas", uid, "Gatos");
                const qSnap = await getDocs(gatosRef);
                qSnap.forEach(gatoDoc => {
                    const g = gatoDoc.data();
                    if (g.estado === 'Morto') return;

                    if (g.estado === 'Doente') {
                        countDoentes++;
                    } else if (g.fome < 30 && g.estado !== 'Em Missão') {
                        countFome++;
                    }
                });

                // 4. ATIVA AS BADGES NA TELA
                const bMissoes = document.getElementById('badge-missoes');
                if (countMissoes > 0) {
                    bMissoes.textContent = `${countMissoes} Ativa${countMissoes > 1 ? 's' : ''}`;
                    bMissoes.style.display = 'block';
                } else { bMissoes.style.display = 'none'; }

                const bTatame = document.getElementById('badge-tatame');
                if (countTreinos > 0) {
                    bTatame.textContent = `${countTreinos} Treinando`;
                    bTatame.style.display = 'block';
                } else { bTatame.style.display = 'none'; }

                const bEnfermaria = document.getElementById('badge-enfermaria');
                if (countDoentes > 0) {
                    bEnfermaria.textContent = `⚠️ ${countDoentes} Doente${countDoentes > 1 ? 's' : ''}`;
                    bEnfermaria.style.display = 'block';
                } else { bEnfermaria.style.display = 'none'; }

                const bDormitorio = document.getElementById('badge-dormitorio');
                let avisosDormitorio = [];
                if (countDoentes > 0) avisosDormitorio.push(`${countDoentes} Doente${countDoentes > 1 ? 's' : ''}`);
                if (countFome > 0) avisosDormitorio.push(`${countFome} c/ Fome`);

                if (avisosDormitorio.length > 0) {
                    bDormitorio.textContent = `⚠️ ` + avisosDormitorio.join(' | ');
                    bDormitorio.style.display = 'block';
                } else { bDormitorio.style.display = 'none'; }

            } catch (error) {
                console.error("Erro ao carregar os dados do banco:", error);
            }
        }

        function mostrarAvatarNaTela(caminhoImg) {
            // A imagem agora vai esticar perfeitamente, sem o espaço invisível em baixo
            fotoClaContainer.innerHTML = `<img src="${caminhoImg}" style="display: block; width: 100%; height: 100%; object-fit: cover;">`;
        }

        function abrirSeletorDeAvatar() {
            modalAvatar.style.display = 'flex';
            listaAvatars.innerHTML = ''; 

            for (let i = 1; i <= 10; i++) {
                const caminhoAvatar = `imagens/avatar${i}.png`;
                const imgNode = document.createElement('img');
                imgNode.src = caminhoAvatar;
                imgNode.alt = `Brasão ${i}`;
                
                imgNode.addEventListener('click', async () => {
                    try {
                        const docRef = doc(db, "Clas", jogadorUid);
                        await updateDoc(docRef, { avatar: caminhoAvatar });
                        mostrarAvatarNaTela(caminhoAvatar);
                        modalAvatar.style.display = 'none';
                    } catch (error) {
                        console.error("Erro ao salvar o brasão selecionado:", error);
                        alert("Não foi possível salvar seu brasão. Tente clicar novamente.");
                    }
                });

                listaAvatars.appendChild(imgNode);
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA configurado com sucesso no Dojo!'))
                    .catch(err => console.error('Erro ao configurar PWA no Dojo:', err));
            });
        }
    </script>
</body>
</html>
