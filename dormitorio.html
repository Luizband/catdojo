<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CatDojo - Dormitório</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a4231">
    <style>
        /* RESET BÁSICO */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        html, body { 
            background-color: #2c2c2c; 
            display: flex; 
            justify-content: center; 
            /* A TRAVA DEFINITIVA PARA ECRÃS MOBILE */
            position: fixed;
            top: 0; 
            bottom: 0; 
            left: 0; 
            right: 0;
            width: 100%;
            overflow: hidden; 
        }

        #app {
            width: 100%; max-width: 414px; height: 100%; position: relative;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column;
            background-image: url('imagens/fundodormitorio.png'); background-size: cover; background-position: center;
        }
        #app::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5); z-index: 1; 
        }

        .conteudo-app { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }

        /* CABEÇALHO PADRÃO */
        header { background-color: #dfc495; padding: 10px 15px; border-bottom: 3px solid #5a4231; }
        .perfil-info { display: flex; gap: 15px; }
        .foto-cla {
            width: 60px; height: 60px; background-color: #ffffff; border: 3px solid #5a4231;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: #a68a61; font-size: 0.7em; font-weight: bold; box-shadow: 0px 3px 0px #5a4231;
        }
        .dados-cla h2 { font-size: 1em; color: #2a2a2a; text-transform: uppercase; }
        .dados-cla p { font-size: 0.8em; color: #2a2a2a; font-weight: bold; margin-bottom: 5px; }
        .economia { display: flex; gap: 15px; font-size: 0.8em; font-weight: bold; color: #4a3b32; }
        .economia div { display: flex; align-items: center; gap: 5px; }
        .economia img { width: 18px; }
        
        .titulo-pagina { text-align: center; background-color: #5a4231; color: #f1ddb0; padding: 5px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;}

        /* GRID DO DORMITÓRIO (MAIS PEQUENO - 3 POR LINHA) */
        main { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        
        .grid-vagas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; margin-bottom: 25px; }

        .vaga-gato {
            background-color: #f1ddb0; border: 3px solid #5a4231; border-radius: 10px;
            aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            position: relative; cursor: pointer; box-shadow: 0px 4px 0px #5a4231; transition: transform 0.1s;
            overflow: visible; /* Permite que a pílula saia do quadrado */
            margin-bottom: 8px; /* Espaço para a pílula do nome */
        }
        .vaga-gato:active { transform: translateY(4px); box-shadow: 0px 0px 0px #5a4231; }
        
        /* A imagem do gato com bordas arredondadas para não sair do card */
        .vaga-gato img.foto-pet { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; object-position: center bottom; border-radius: 7px;
        }
        
        /* Pílula flutuante na borda inferior */
        .pilula-nome {
            position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            z-index: 2; background-color: #5a4231; color: #f1ddb0; width: max-content;
            padding: 2px 10px; border-radius: 12px; font-size: 0.75em; font-weight: bold;
            text-transform: uppercase; border: 2px solid #dfc495;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.5); white-space: nowrap;
        }
        
        .status-icone {
            position: absolute; top: -8px; right: -8px; background-color: #fdf5e6; border: 2px solid #5a4231;
            border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0px 2px 4px rgba(0,0,0,0.3); z-index: 3;
        }
        .status-icone img { width: 65%; height: auto; }

        .vaga-livre { background-color: #e5cd9e; border: 3px dashed #a68a61; cursor: default; box-shadow: none; justify-content: center; overflow: hidden;}
        .vaga-livre p { color: #a68a61; font-weight: bold; font-size: 0.8em; text-align: center;}
        
        .vaga-bloqueada { background-color: #7b7b7b; border: 3px solid #4a4a4a; cursor: default; box-shadow: none; filter: grayscale(100%); opacity: 0.7; justify-content: center; overflow: hidden;}
        .vaga-bloqueada p { color: #2c2c2c; font-weight: bold; font-size: 0.8em;}

        .btn-comprar-vaga {
            background-color: #d27d46; color: white; border: 2px solid #5a4231; padding: 10px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0px 4px 0px #5a4231; width: 100%; text-transform: uppercase;
        }

        /* NAVEGAÇÃO INFERIOR */
        nav { 
            background-color: #e5cd9e; 
            border-top: 3px solid #5a4231; 
            display: flex; 
            justify-content: space-around; 
            flex-shrink: 0;
            padding: 10px 5px; 
            /* Protege os botões da barra de gestos do sistema (tanto no Android como no iPhone) */
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75em; font-weight: bold; color: #4a3b32; cursor: pointer; text-decoration: none;}
        .nav-item img { width: 40px; margin-bottom: 3px; }

        /* ==========================================
           MODAL: PAINEL DO GATO
           ========================================== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.8);
            z-index: 100; display: none; justify-content: center; align-items: flex-end; 
        }
        
        .painel-gato {
            background-color: #f1ddb0; width: 100%; max-width: 414px; border-top: 4px solid #5a4231;
            border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; position: relative;
        }

        .btn-fechar { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5em; color: #5a4231; cursor: pointer; font-weight: bold; z-index: 10;}

        .cabecalho-pet { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; position: relative;}
        .cabecalho-pet img.foto-modal { width: 80px; height: 80px; object-fit: cover; border: 3px solid #5a4231; border-radius: 10px; background-color: #fff;}
        
        .info-cabecalho { flex: 1; }
        .info-cabecalho input { background: transparent; border: none; border-bottom: 2px solid #a68a61; font-size: 1.3em; font-weight: bold; color: #2a2a2a; width: 100%; outline: none; text-transform: uppercase; margin-bottom: 8px;}
        
        /* Layout flex para a idade/estado ficarem ao lado da faixa */
        .info-detalhes { display: flex; justify-content: space-between; align-items: center; }
        .textos-detalhes p { font-size: 0.85em; color: #5a4231; font-weight: bold; margin-bottom: 3px;}
        .imagem-faixa-modal { width: 55px; height: 55px; object-fit: contain; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3)); }

        /* Barras Vitais */
        .box-barras { background-color: #e5cd9e; padding: 10px; border-radius: 8px; border: 2px solid #a68a61; margin-bottom: 15px; }
        .linha-barra { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 0.85em; font-weight: bold; color: #2a2a2a;}
        
        .barra-fundo { width: 70%; height: 18px; background-color: #2c2c2c; border-radius: 8px; overflow: hidden; border: 1px solid #5a4231; position: relative; }
        .barra-hp { height: 100%; background-color: #cc3333; width: 100%; transition: width 0.3s; }
        .barra-fome { height: 100%; background-color: #a67c52; width: 100%; transition: width 0.3s; }
        .barra-xp { height: 100%; background-color: #3399ff; width: 0%; transition: width 0.3s; }
        
        /* Novo estilo para o número dentro da barra */
        .texto-barra { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            color: white; font-size: 0.8em; font-weight: bold; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9); z-index: 2; pointer-events: none; 
        }

        /* Atributos */
        .box-stats { background-color: #fdf5e6; border: 2px solid #5a4231; border-radius: 8px; padding: 15px; margin-bottom: 15px;}
        .titulo-stats { text-align: center; font-weight: bold; color: #2a2a2a; margin-bottom: 10px; font-size: 0.9em;}
        .linha-stat { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; color: #4a3b32;}
        .controles-stat { display: flex; align-items: center; gap: 10px; }
        .btn-stat { background-color: #dfc495; border: 2px solid #5a4231; width: 25px; height: 25px; border-radius: 5px; font-weight: bold; cursor: pointer;}
        
        /* NOVO: Estilo para quando não há pontos para distribuir */
        .btn-stat:disabled {
            background-color: #7b7b7b;
            border-color: #4a4a4a;
            color: #dcdcdc;
            cursor: not-allowed;
        }
        
        .botoes-stats-acoes { display: flex; justify-content: space-between; margin-top: 15px; gap: 10px;}
        .btn-salvar-stats { flex: 1; background-color: #4CAF50; color: white; border: 2px solid #2E7D32; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0px 3px 0px #2E7D32; font-size: 0.75em;}
        .btn-resetar-stats { 
            background-color: #7b7b7b; color: #dcdcdc; border: 2px solid #4a4a4a; padding: 6px 10px; 
            border-radius: 6px; font-weight: bold; cursor: not-allowed; font-size: 0.75em;
        }
        .btn-resetar-stats.ativo {
            background-color: #FF9800; color: white; border-color: #E65100; cursor: pointer; box-shadow: 0px 3px 0px #E65100;
        }

        /* Slots de Batalha */
        .box-habilidades { margin-bottom: 20px; }
        .box-habilidades h4 { color: #2a2a2a; font-size: 0.9em; margin-bottom: 5px;}
        .grid-slots { display: flex; gap: 10px; }
        .slot-habilidade { 
            width: 45px; height: 45px; background-color: #7b7b7b; border: 2px solid #5a4231; 
            border-radius: 8px; display: flex; align-items: center; justify-content: center; 
            font-size: 1.2em; color: #ccc; overflow: hidden;
        }
        .slot-habilidade img { width: 80%; height: 80%; object-fit: contain; }
        .slot-liberado { background-color: #dfc495; border-style: dashed; color: #5a4231; cursor: pointer;}
        .slot-liberado:hover { background-color: #e5cd9e; }

        /* Ações Finais - Ícones Duplicados de Tamanho */
        .grid-acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-acao { 
            background-color: #dfc495; border: 2px solid #5a4231; padding: 10px; border-radius: 8px; 
            font-weight: bold; color: #2a2a2a; cursor: pointer; box-shadow: 0px 3px 0px #5a4231; 
            text-transform: uppercase; font-size: 0.85em; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-acao img { width: 44px; height: 44px; object-fit: contain; } 
        .btn-acao:active { box-shadow: 0px 0px 0px #5a4231; transform: translateY(3px); }
        .btn-dispensar { background-color: transparent; border: 2px dashed #cc3333; color: #cc3333; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8em;}

        /* ==========================================
           MODAL DE SELEÇÃO DE ARTES
           ========================================== */
        .modal-habilidades {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.85);
            z-index: 200; display: none; justify-content: center; align-items: center;
        }
        .painel-habilidades {
            background-color: #f1ddb0; width: 90%; max-width: 380px; border: 3px solid #5a4231;
            border-radius: 12px; padding: 20px; box-shadow: 0px 10px 20px rgba(0,0,0,0.5);
            max-height: 80vh; overflow-y: auto;
        }
        
        .arte-item-dojo {
            background-color: #dfc495; border: 2px solid #5a4231; border-radius: 8px; padding: 12px; 
            margin-bottom: 12px; cursor: pointer; box-shadow: 0px 4px 0px #5a4231; display: flex; 
            align-items: center; gap: 15px; transition: transform 0.1s;
        }
        .arte-item-dojo:active { transform: translateY(4px); box-shadow: 0px 0px 0px #5a4231; }
        
        .arte-icone-lista { width: 55px; height: 55px; object-fit: contain; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3)); flex-shrink: 0;}
        .arte-info-wrapper { flex: 1; display: flex; flex-direction: column; justify-content: center;}
        .arte-info-wrapper h4 { font-size: 1.1em; color: #2a2a2a; text-transform: uppercase; margin: 0 0 6px 0; letter-spacing: 1px;}
        
        .arte-progresso-bg {
            width: 100%; height: 16px; background-color: #2c2c2c; border-radius: 8px; border: 2px solid #5a4231; 
            position: relative; overflow: hidden;
        }
        .arte-progresso-fill { height: 100%; }
        .arte-texto-pe {
            position: absolute; top: -1px; left: 0; width: 100%; text-align: center; font-size: 0.75em; 
            color: white; font-weight: bold; line-height: 16px; text-shadow: 1px 1px 2px #000;
        }

        .tecnica-row {
            display: flex; align-items: center; gap: 12px; padding: 10px; border: 2px solid #5a4231; 
            border-radius: 8px; margin-bottom: 8px; background-color: #dfc495; cursor: pointer; text-align: left;
        }
        .tecnica-row.bloqueada { filter: grayscale(100%); opacity: 0.6; cursor: not-allowed; background-color: #ccc; border-color: #777;}
        .tecnica-row img { width: 32px; height: 32px; object-fit: contain; }
        .tecnica-info h5 { font-size: 0.85em; color: #2a2a2a; text-transform: uppercase; margin-bottom: 2px; }
        .tecnica-info p { font-size: 0.75em; color: #5a4231; font-weight: bold; line-height: 1.1em; }
        .tecnica-pe { font-size: 0.75em; font-weight: bold; color: #b30000; margin-left: auto; white-space: nowrap; }

        /* ==========================================
           SISTEMA DE AVISOS (TOASTS E MODAL CENTRO)
           ========================================== */
        #toastContainer {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .toast-msg {
            background-color: #2c2c2c; color: #f1ddb0; padding: 12px 24px; border: 2px solid #dfc495;
            border-radius: 8px; font-weight: bold; text-align: center; box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
            animation: fadeInOut 2s forwards; pointer-events: auto; cursor: pointer; text-transform: uppercase; font-size: 0.85em;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        .modal-centro {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.85);
            z-index: 1000; display: none; justify-content: center; align-items: center;
        }
        .painel-centro {
            background-color: #f1ddb0; width: 85%; max-width: 320px; border: 3px solid #5a4231;
            border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0px 10px 20px rgba(0,0,0,0.5);
        }
        .painel-centro p { color: #2a2a2a; font-weight: bold; margin-bottom: 20px; font-size: 1.05em; }
        .botoes-centro { display: flex; gap: 10px; justify-content: center; }
        .btn-centro {
            flex: 1; padding: 10px; background-color: #dfc495; border: 2px solid #5a4231; border-radius: 8px; 
            font-weight: bold; cursor: pointer; box-shadow: 0px 3px 0px #5a4231; color: #2a2a2a; text-transform: uppercase;
        }
        .btn-centro:active { box-shadow: 0px 0px 0px #5a4231; transform: translateY(3px); }
        .btn-centro.cancelar { background-color: transparent; border: 2px dashed #a68a61; box-shadow: none; }

    </style>
</head>
<body>
    <div id="toastContainer"></div>
    
    <div class="modal-centro" id="modalConfirmacao">
        <div class="painel-centro">
            <p id="textoConfirmacao">Tem certeza?</p>
            <div class="botoes-centro">
                <button class="btn-centro cancelar" id="btnCancelarConfirm">Cancelar</button>
                <button class="btn-centro" id="btnAceitarConfirm">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="app">
        <div class="conteudo-app">
            
            <header>
                <div class="perfil-info">
                    <div class="foto-cla" id="fotoClaContainer">
                        <span id="placeholderFoto">FOTO</span>
                    </div>
                    <div class="dados-cla">
                        <h2 id="exibeNomeCla">CARREGANDO...</h2>
                        <p id="exibeNomeMestre">Mestre...</p>
                        <div class="economia">
                            <div><img src="icones/moeda.png" alt="Moedas"> <span id="exibeMoedas">0</span></div>
                            <div><img src="icones/rep.png" alt="Reputação"> <span id="exibeReputacao">0/500</span></div>
                        </div>
                    </div>
                </div>
            </header>
            <div class="titulo-pagina">Dormitório</div>

            <main>
                <div class="grid-vagas" id="gridDormitorio">
                    </div>
                
                <button class="btn-comprar-vaga" id="btnComprarVaga" style="display: none;">
                    Expandir Dormitório (100 Moedas)
                </button>
            </main>

            <nav>
                <a href="dojo.html" class="nav-item">
                    <img src="icones/Dojo.png" alt="Dojo">DOJO
                </a>
                <div class="nav-item">
                    <img src="icones/adocao.png" alt="Adoção">Adoção
                </div>
                <div class="nav-item">
                    <img src="icones/arena.png" alt="Arena">ARENA
                </div>
                <div class="nav-item">
                    <img src="icones/loja.png" alt="Loja">LOJA
                </div>
            </nav>
        </div>
    </div>

    <div class="modal-overlay" id="modalGato">
        <div class="painel-gato">
            <button class="btn-fechar" id="btnFecharModal">X</button>
            
            <div class="cabecalho-pet">
                <img src="imagens/gato01.png" id="modalFoto" class="foto-modal" alt="Gato">
                <div class="info-cabecalho">
                    <input type="text" id="modalNome" maxlength="10">
                    <div class="info-detalhes">
                        <div class="textos-detalhes">
                            <p>Idade: <span id="modalIdade">0</span> horas</p>
                            <p>Estado: <span id="modalEstado" style="color: #2E7D32;">Saudável</span></p>
                        </div>
                        <img src="imagens/01.png" id="imgFaixaGato" class="imagem-faixa-modal" alt="Faixa">
                    </div>
                </div>
            </div>

            <div class="box-barras">
                <div class="linha-barra">
                    <span>HP</span>
                    <div class="barra-fundo">
                        <div class="barra-hp" id="fillHp"></div>
                        <div class="texto-barra" id="txtHp">250/250</div>
                    </div>
                </div>
                <div class="linha-barra">
                    <span>Saciedade</span>
                    <div class="barra-fundo">
                        <div class="barra-fome" id="fillFome"></div>
                        <div class="texto-barra" id="txtFome">100/100</div>
                    </div>
                </div>
                <div class="linha-barra">
                    <span>XP</span>
                    <div class="barra-fundo">
                        <div class="barra-xp" id="fillXp"></div>
                        <div class="texto-barra" id="txtXp">0/500</div>
                    </div>
                </div>
            </div>

            <div class="box-stats">
                <div class="titulo-stats">Atributos <span style="color:#d27d46;">(Pontos: <span id="ptsLivres">0</span>)</span></div>
                
                <div class="linha-stat">Força <div class="controles-stat"><button class="btn-stat btn-sub" data-attr="forca">-</button> <span id="val-forca">1</span> <button class="btn-stat btn-add" data-attr="forca">+</button></div></div>
                <div class="linha-stat">Agilidade <div class="controles-stat"><button class="btn-stat btn-sub" data-attr="agilidade">-</button> <span id="val-agi">1</span> <button class="btn-stat btn-add" data-attr="agilidade">+</button></div></div>
                <div class="linha-stat">Resistência <div class="controles-stat"><button class="btn-stat btn-sub" data-attr="resistencia">-</button> <span id="val-res">1</span> <button class="btn-stat btn-add" data-attr="resistencia">+</button></div></div>
                <div class="linha-stat">Foco <div class="controles-stat"><button class="btn-stat btn-sub" data-attr="foco">-</button> <span id="val-foco">1</span> <button class="btn-stat btn-add" data-attr="foco">+</button></div></div>
                
                <div class="botoes-stats-acoes">
                    <button class="btn-salvar-stats" id="btnSalvarGato">Salvar Status & Nome</button>
                    <button class="btn-resetar-stats" id="btnResetarStats">RESETAR STATUS</button>
                </div>
            </div>

            <div class="box-habilidades">
                <h4>Slots de Batalha</h4>
                <div class="grid-slots" id="boxSlotsHabilidades">
                    </div>
            </div>

            <div class="grid-acoes">
                <button class="btn-acao" id="btnAlimentar">
                    <img src="icones/alimentar.png" alt="Icon"> Alimentar
                </button>
                <button class="btn-acao" id="btnDescansar">
                    <img src="icones/descanso.png" alt="Icon"> Descansar
                </button>
            </div>
            <button class="btn-dispensar" id="btnDispensar">Expulsar do Clã</button>

        </div>
    </div>

    <div class="modal-habilidades" id="modalHabilidades">
        <div class="painel-habilidades">
            <button class="btn-fechar" id="btnFecharHabilidades" style="position: relative; float: right; top: -5px; right: -5px;">X</button>
            <h3 id="tituloModalHabilidades" style="color: #2a2a2a; text-transform: uppercase; margin-bottom: 15px; font-size: 1em; letter-spacing: 1px;">Selecione a Arte Marcial</h3>
            <div id="conteudoModalHabilidades">
                </div>
        </div>
    </div>

    <div class="modal-habilidades" id="modalAlimentos">
        <div class="painel-habilidades">
            <button class="btn-fechar" id="btnFecharAlimentos" style="position: relative; float: right; top: -5px; right: -5px;">X</button>
            <h3 style="color: #2a2a2a; text-transform: uppercase; margin-bottom: 15px; font-size: 1em; letter-spacing: 1px;">Depósito: Alimentos</h3>
            <div id="conteudoModalAlimentos">
                </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDoc, doc, collection, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { ARTES_MARCIAIS } from './artes-marciais.js';
        import { ITENS } from './itens.js';

        // ANTIGO: let inventario = {};
        let inventarioInstancias = [];

        // ==========================================
        // SISTEMA DE AVISOS (TOAST E CONFIRMAÇÃO)
        // ==========================================
        function mostrarToast(mensagem) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.textContent = mensagem;
            toast.onclick = () => toast.remove();
            container.appendChild(toast);
            
            setTimeout(() => { if(toast.parentElement) toast.remove(); }, 2000);
        }

        function pedirConfirmacao(mensagem, callback) {
            document.getElementById('textoConfirmacao').textContent = mensagem;
            document.getElementById('modalConfirmacao').style.display = 'flex';
            
            document.getElementById('btnAceitarConfirm').onclick = () => {
                document.getElementById('modalConfirmacao').style.display = 'none';
                callback();
            };
            document.getElementById('btnCancelarConfirm').onclick = () => {
                document.getElementById('modalConfirmacao').style.display = 'none';
            };
        }

        let slotAtivoIndex = null; 

        // Variáveis de Estado
        let jogadorUid = null;
        let vagasTotais = 10;
        let vagasLiberadas = 3; 
        let listaGatosData = [];
        let gatoSelecionado = null; 
        let atributosBase = {};
        let atributosTemp = {};
        let pontosLivresTemp = 0;

        // Elementos UI Principais
        const gridDormitorio = document.getElementById('gridDormitorio');
        const modalGato = document.getElementById('modalGato');
        const btnFecharModal = document.getElementById('btnFecharModal');
        const btnResetarStats = document.getElementById('btnResetarStats');
        
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                jogadorUid = user.uid;
                await carregarCabecalho(user.uid);
                await carregarDormitorio(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });

        async function carregarCabecalho(uid) {
            const docRef = doc(db, "Clas", uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const dados = docSnap.data();
                
                let textoCla = dados.nomeCla ? dados.nomeCla.trim() : "DESCONHECIDO";
                if (!textoCla.toUpperCase().startsWith("CLÃ") && !textoCla.toUpperCase().startsWith("CLA")) { textoCla = "CLÃ " + textoCla; }
                document.getElementById('exibeNomeCla').textContent = textoCla.toUpperCase();

                let textoMestre = dados.nomeMestre ? dados.nomeMestre.trim() : "...";
                if (!textoMestre.toUpperCase().startsWith("MESTRE")) { textoMestre = "Mestre " + textoMestre; }
                document.getElementById('exibeNomeMestre').textContent = textoMestre;

                document.getElementById('exibeMoedas').textContent = dados.moedas !== undefined ? dados.moedas : 50;
                document.getElementById('exibeReputacao').textContent = `${dados.reputacao || 0}/500`;
                
                vagasLiberadas = dados.vagasDormitorio || 3;

                /// ANTIGO: inventario = dados.inventario || {};
                inventarioInstancias = dados.inventarioInstancias || [];

                if (dados.avatar) {
                    document.getElementById('fotoClaContainer').innerHTML = `<img src="${dados.avatar}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">`;
                }
            }
        }

        async function carregarDormitorio(uid) {
            gridDormitorio.innerHTML = '';
            listaGatosData = [];

            const gatosRef = collection(db, "Clas", uid, "Gatos");
            const querySnapshot = await getDocs(gatosRef);
            
            const agora = Date.now();
            let atualizacoesPendentes = [];

           querySnapshot.forEach((docSnap) => {
                let gato = { id: docSnap.id, ...docSnap.data() };
                if (gato.estado === 'Morto') return; // Se o gato faleceu, some do dormitório!
                let precisaSalvar = false;

                // SISTEMA DE TEMPO REAL
                if (!gato.ultimaAtualizacao) {
                    gato.ultimaAtualizacao = agora;
                    precisaSalvar = true;
                } else {
                    const horasPassadas = (agora - gato.ultimaAtualizacao) / (1000 * 60 * 60);

                    if (horasPassadas > 0.01) { 
                        gato.idadeHoras = (gato.idadeHoras || 0) + horasPassadas;

                        // Nova Lógica: A saciedade decai SEMPRE, mesmo descansando!
                        if (gato.fome > 0) {
                            gato.fome -= (5 * horasPassadas);
                            if (gato.fome <= 0) {
                                gato.fome = 0;
                                if (gato.estado !== 'Doente') gato.estado = 'Doente';
                            }
                        }

                        if (gato.estado === 'Descansando' && gato.hpAtual < gato.hpMax) {
                            gato.hpAtual += (gato.hpMax * 0.10) * horasPassadas;
                            if (gato.hpAtual >= gato.hpMax) {
                                gato.hpAtual = gato.hpMax;
                                gato.estado = 'Saudável'; 
                            }
                        }

                        gato.ultimaAtualizacao = agora;
                        precisaSalvar = true;
                    }
                }

                // ==========================================
                // NOVO: SISTEMA DE EVOLUÇÃO (LEVEL UP) E PREVENÇÃO
                // ==========================================
                gato.nivel = gato.nivel || 1;
                gato.xpAtual = gato.xpAtual || 0;
                gato.xpProxFaixa = gato.xpProxFaixa || 500;
                gato.faixa = gato.faixa || "Branca";
                gato.pontosLivres = gato.pontosLivres || 0;
                
                if (gato.xpAtual >= gato.xpProxFaixa && gato.nivel < 20) {
                    gato.xpAtual = gato.xpAtual - gato.xpProxFaixa;
                    gato.nivel = gato.nivel + 1;
                    
                    const nomesFaixas = [
                        "Branca", "Cinza/Branca", "Cinza", "Cinza/Amarela", "Amarela", 
                        "Amarela/Laranja", "Laranja", "Laranja/Verde", "Verde", "Verde/Azul", 
                        "Azul", "Azul/Roxa", "Roxa", "Roxa/Marrom", "Marrom", 
                        "Marrom/Preta", "Preta", "Preta 1º Dan", "Preta 2º Dan", "Preta 3º Dan"
                    ];
                    gato.faixa = nomesFaixas[gato.nivel - 1] || `Nível ${gato.nivel}`;
                    gato.pontosLivres = gato.pontosLivres + 7;
                    gato.xpProxFaixa = gato.xpProxFaixa + 500; 

                    precisaSalvar = true;
                    mostrarToast(`Subiu de Faixa! ${gato.nome} agora é Faixa ${gato.faixa}!`);
                }
                // ==========================================

                listaGatosData.push(gato);

                if (precisaSalvar) {
                    const gatoRef = doc(db, "Clas", uid, "Gatos", gato.id);
                    atualizacoesPendentes.push(updateDoc(gatoRef, {
                        fome: gato.fome !== undefined ? gato.fome : 100,
                        hpAtual: gato.hpAtual !== undefined ? gato.hpAtual : 250,
                        estado: gato.estado || 'Saudável',
                        idadeHoras: gato.idadeHoras || 0,
                        ultimaAtualizacao: gato.ultimaAtualizacao,
                        xpAtual: gato.xpAtual,
                        nivel: gato.nivel,
                        faixa: gato.faixa,
                        pontosLivres: gato.pontosLivres,
                        xpProxFaixa: gato.xpProxFaixa
                    }));
                }
            });

            if (atualizacoesPendentes.length > 0) {
                await Promise.all(atualizacoesPendentes);
            }

            renderizarGrid();
        }

        function renderizarGrid() {
            gridDormitorio.innerHTML = '';
            
            for (let i = 0; i < vagasTotais; i++) {
                const divCard = document.createElement('div');
                
                if (i < vagasLiberadas) {
                    if (i < listaGatosData.length) {
                        const gato = listaGatosData[i];
                        divCard.className = 'vaga-gato';
                        
                        let htmlIcone = '';
                        let caminhoIcone = '';

                        if (gato.estado === 'Doente') { caminhoIcone = 'icones/doente.png'; } 
                        else if (gato.fome < 30) { caminhoIcone = 'icones/fome.png'; } 
                        else if (gato.estado === 'Descansando') { caminhoIcone = 'icones/descanso.png'; }

                        if (caminhoIcone !== '') {
                            htmlIcone = `<div class="status-icone"><img src="${caminhoIcone}" alt="Status"></div>`;
                        }

                        divCard.innerHTML = `
                            ${htmlIcone}
                            <img src="${gato.foto}" class="foto-pet" alt="Foto">
                            <div class="pilula-nome">${gato.nome}</div>
                        `;
                        divCard.onclick = () => abrirPainelGato(gato);
                    } else {
                        divCard.className = 'vaga-gato vaga-livre';
                        divCard.innerHTML = `<p>VAGA LIVRE</p>`;
                    }
                } else {
                    divCard.className = 'vaga-gato vaga-bloqueada';
                    divCard.innerHTML = `<p>BLOQUEADO</p> <span style="font-size:1.5em">🔒</span>`;
                }
                gridDormitorio.appendChild(divCard);
            }

            const btnComprar = document.getElementById('btnComprarVaga');
            if (vagasLiberadas < vagasTotais) {
                btnComprar.style.display = 'block';
            } else {
                btnComprar.style.display = 'none';
            }
        }

        // ==========================================
        // LÓGICA DO MODAL (PAINEL DO GATO)
        // ==========================================
        
        btnFecharModal.onclick = () => { modalGato.style.display = 'none'; gatoSelecionado = null; }

        function abrirPainelGato(gato) {
            gatoSelecionado = gato;
            modalGato.style.display = 'flex';

            const nivelExato = gato.nivel || 1; 
            document.getElementById('imgFaixaGato').src = `imagens/${String(nivelExato).padStart(2, '0')}.png`;

            document.getElementById('modalFoto').src = gato.foto;
            document.getElementById('modalNome').value = gato.nome;
            document.getElementById('modalIdade').textContent = Math.floor(gato.idadeHoras);
            
            const estadoEl = document.getElementById('modalEstado');
            estadoEl.textContent = gato.estado;
            estadoEl.style.color = gato.estado === 'Doente' ? '#cc3333' : '#2E7D32';

            document.getElementById('txtHp').textContent = `${Math.round(gato.hpAtual)}/${gato.hpMax}`;
            document.getElementById('fillHp').style.width = `${(gato.hpAtual / gato.hpMax) * 100}%`;

            document.getElementById('txtFome').textContent = `${Math.round(gato.fome)}/100`;
            document.getElementById('fillFome').style.width = `${gato.fome}%`;

            document.getElementById('txtXp').textContent = `${gato.xpAtual}/${gato.xpProxFaixa}`;
            document.getElementById('fillXp').style.width = `${(gato.xpAtual / gato.xpProxFaixa) * 100}%`;

            // Carrega os pontos reais do banco para a nossa memória temporária
            atributosBase = { ...gato.atributos };
            atributosTemp = { ...gato.atributos };
            pontosLivresTemp = gato.pontosLivres || 0; 
            
            atualizarInterfaceAtributos(); // Pinta os números na tela 

            // NOVO: Verifica se tem a caixa do biscoito fisicamente na grid
            const temBiscoito = inventarioInstancias.some(inst => inst.itemId === 'biscoitinho');
            if (temBiscoito) {
                btnResetarStats.classList.add('ativo');
                btnResetarStats.disabled = false;
            } else {
                btnResetarStats.classList.remove('ativo');
                btnResetarStats.disabled = true;
            }

            const boxSlots = document.getElementById('boxSlotsHabilidades');
            boxSlots.innerHTML = '';

            let slotsLiberadosCount = 1;
            if (nivelExato >= 2) slotsLiberadosCount = 2;
            if (nivelExato >= 3) slotsLiberadosCount = 3;
            if (nivelExato >= 5) slotsLiberadosCount = 5;

            if (!gato.habilidadesEquipadas) { gato.habilidadesEquipadas = [null, null, null, null, null]; }

            for (let i = 0; i < 5; i++) {
                const slotDiv = document.createElement('div');
                
                if (i < slotsLiberadosCount) {
                    slotDiv.className = "slot-habilidade slot-liberado";
                    const habEquipada = gato.habilidadesEquipadas[i];
                    
                    if (habEquipada) {
                        slotDiv.innerHTML = `<img src="${habEquipada.iconeArte}" title="${habEquipada.nomeTecnica}">`;
                        slotDiv.style.borderColor = habEquipada.corArte;
                    } else {
                        slotDiv.textContent = "+";
                    }
                    
                    slotDiv.onclick = () => {
                        if (gatoSelecionado.estado === 'Doente') {
                            mostrarToast("Este gato está doente! Precisa ser tratado na Enfermaria.");
                            return;
                        }
                        abrirSeletorArtes(i);
                    };
                } else {
                    slotDiv.className = "slot-habilidade";
                    slotDiv.textContent = "🔒";
                }
                boxSlots.appendChild(slotDiv);
            }

            // Atualiza o botão de Descansar para "Acordar" caso o gato já esteja na cama
            const btnDescansar = document.getElementById('btnDescansar');
            if (gato.estado === 'Descansando') {
                btnDescansar.innerHTML = `<img src="icones/descanso.png" alt="Icon"> Acordar`;
            } else {
                btnDescansar.innerHTML = `<img src="icones/descanso.png" alt="Icon"> Descansar`;
            }
            
            // Desativa a edição de nome e botões de stats se estiver doente
            const doente = gato.estado === 'Doente';
            document.getElementById('modalNome').disabled = doente;
            
            // Ativa o botão de Reset de Biscoitinho apenas se estiver saudável e tiver o item
            if (temBiscoito && !doente) {
                btnResetarStats.classList.add('ativo');
                btnResetarStats.disabled = false;
            } else {
                btnResetarStats.classList.remove('ativo');
                btnResetarStats.disabled = true;
            }
        }

        // ==========================================
        // BOTÕES DE AÇÃO DO GATO (FIREBASE E TOASTS)
        // ==========================================
        // Fechar o Modal de Alimentos
        document.getElementById('btnFecharAlimentos').onclick = () => { 
            document.getElementById('modalAlimentos').style.display = 'none'; 
        };

        document.getElementById('btnAlimentar').onclick = () => {
            if (gatoSelecionado.estado === 'Doente') {
                mostrarToast("Este gato está doente! Precisa ser tratado na Enfermaria.");
                return;
            }
            if (gatoSelecionado.fome >= 100) {
                mostrarToast(`${gatoSelecionado.nome} já está de barriga cheia!`);
                return;
            }

            // NOVO: Conta fisicamente quantos pacotes de cada comida existem na grid
            let contagemComidas = {};
            inventarioInstancias.forEach(inst => {
                const refDb = ITENS[inst.itemId];
                if (refDb && refDb.tipo === "alimento") {
                    contagemComidas[inst.itemId] = (contagemComidas[inst.itemId] || 0) + 1;
                }
            });

            if (Object.keys(contagemComidas).length === 0) {
                mostrarToast("Você não tem alimentos no depósito!");
                return;
            }

            const conteudo = document.getElementById('conteudoModalAlimentos');
            conteudo.innerHTML = '';
            
            Object.keys(contagemComidas).forEach(idItem => {
                const qtd = contagemComidas[idItem];
                const itemDb = ITENS[idItem];
                
                const div = document.createElement('div');
                div.className = 'tecnica-row'; 
                div.innerHTML = `
                    <img src="${itemDb.icone}" alt="${itemDb.nome}" style="width: 40px; height: 40px; object-fit: contain;">
                    <div class="tecnica-info">
                        <h5>${itemDb.nome} (x${qtd})</h5>
                        <p>${itemDb.desc}</p>
                    </div>
                    <div class="tecnica-pe" style="color: #2E7D32;">USAR</div>
                `;
                
                div.onclick = () => {
                    pedirConfirmacao(`Alimentar ${gatoSelecionado.nome} com ${itemDb.nome}?`, () => consumirAlimento(idItem, itemDb));
                };
                conteudo.appendChild(div);
            });

            document.getElementById('modalAlimentos').style.display = 'flex';
        };

       async function consumirAlimento(idItem, itemDb) {
            try {
                let novaFome = gatoSelecionado.fome + (itemDb.recuperaFome || 0);
                if (novaFome > 100) novaFome = 100;
                let novoHp = gatoSelecionado.hpAtual + (itemDb.recuperaHp || 0);
                if (novoHp > gatoSelecionado.hpMax) novoHp = gatoSelecionado.hpMax;

                // NOVO: Exclui a primeira caixa física que ele encontrar dessa ração na grid
                const index = inventarioInstancias.findIndex(inst => inst.itemId === idItem);
                if (index !== -1) {
                    inventarioInstancias.splice(index, 1);
                }

                const agora = Date.now();
                const gatoRef = doc(db, "Clas", jogadorUid, "Gatos", gatoSelecionado.id);
                await updateDoc(gatoRef, { fome: novaFome, hpAtual: novoHp, ultimaAtualizacao: agora });

                // NOVO: Salva a matriz inteira atualizada de volta
                const claRef = doc(db, "Clas", jogadorUid);
                await updateDoc(claRef, { inventarioInstancias: inventarioInstancias }); 

                gatoSelecionado.fome = novaFome;
                gatoSelecionado.hpAtual = novoHp;
                gatoSelecionado.ultimaAtualizacao = agora;
                
                document.getElementById('txtFome').textContent = `${Math.round(novaFome)}/100`;
                document.getElementById('fillFome').style.width = `${novaFome}%`;
                document.getElementById('txtHp').textContent = `${Math.round(novoHp)}/${gatoSelecionado.hpMax}`;
                document.getElementById('fillHp').style.width = `${(novoHp / gatoSelecionado.hpMax) * 100}%`;

                document.getElementById('modalAlimentos').style.display = 'none';
                mostrarToast(`${gatoSelecionado.nome} consumiu ${itemDb.nome}!`);
                
                carregarDormitorio(jogadorUid); 
            } catch (e) { console.error("Erro ao comer:", e); }
        }
        document.getElementById('btnDescansar').onclick = async () => {
            if (gatoSelecionado.estado === 'Doente') {
                mostrarToast("Este gato está doente! Precisa ser tratado na Enfermaria.");
                return;
            }
            try {
                const novoEstado = gatoSelecionado.estado === 'Descansando' ? 'Saudável' : 'Descansando';
                const gatoRef = doc(db, "Clas", jogadorUid, "Gatos", gatoSelecionado.id);
                const agora = Date.now();
                await updateDoc(gatoRef, { estado: novoEstado, ultimaAtualizacao: agora });
                
                gatoSelecionado.estado = novoEstado;
                gatoSelecionado.ultimaAtualizacao = agora;
                const estadoEl = document.getElementById('modalEstado');
                estadoEl.textContent = novoEstado;
                estadoEl.style.color = novoEstado === 'Doente' ? '#cc3333' : '#2E7D32';

                // Altera o botão instantaneamente na tela
                const btnDescansar = document.getElementById('btnDescansar');
                if (novoEstado === 'Descansando') {
                    btnDescansar.innerHTML = `<img src="icones/descanso.png" alt="Icon"> Acordar`;
                } else {
                    btnDescansar.innerHTML = `<img src="icones/descanso.png" alt="Icon"> Descansar`;
                }
                
                mostrarToast(novoEstado === 'Descansando' ? 
                    `${gatoSelecionado.nome} foi deitar!` : 
                    `${gatoSelecionado.nome} acordou!`);
                
                carregarDormitorio(jogadorUid); 
            } catch(e) { console.error(e); }
        };


        // Botão de Reset (O Biscoito Mágico)
        document.getElementById('btnResetarStats').onclick = () => {
            if (gatoSelecionado.estado === 'Doente') {
                mostrarToast("Este gato está doente! Precisa ser tratado na Enfermaria.");
                return;
            }
            const indexBiscoito = inventarioInstancias.findIndex(inst => inst.itemId === 'biscoitinho');
            
            if (indexBiscoito !== -1) {
                pedirConfirmacao("Deseja gastar 1 Biscoito Mágico para resetar os status?", async () => {
                    try {
                        // 1. Remove a caixa física do biscoito da grid (O Splice)
                        inventarioInstancias.splice(indexBiscoito, 1);
                        
                        // 2. Atualiza a perda da caixa no Depósito do Firebase
                        const claRef = doc(db, "Clas", jogadorUid);
                        await updateDoc(claRef, { inventarioInstancias: inventarioInstancias });
                        
                        // 3. Soma todos os pontos atualmente gastos nos atributos
                        const totalPontosGastos = atributosTemp.forca + atributosTemp.agilidade + atributosTemp.resistencia + atributosTemp.foco;
                        
                        // 4. Devolve os pontos para a carteira livre, subtraindo os 4 pontos mínimos
                        pontosLivresTemp += (totalPontosGastos - 4);
                        
                        // 5. Zera os atributos na memória temporária e na base de comparação
                        atributosTemp = { forca: 1, agilidade: 1, resistencia: 1, foco: 1 };
                        atributosBase = { forca: 1, agilidade: 1, resistencia: 1, foco: 1 }; 
                        
                        // 6. Pinta a tela na hora
                        atualizarInterfaceAtributos();
                        
                        // 7. Desativa o botão se acabaram as caixas de biscoitos
                        const aindaTemBiscoito = inventarioInstancias.some(inst => inst.itemId === 'biscoitinho');
                        if (!aindaTemBiscoito) {
                            btnResetarStats.classList.remove('ativo');
                            btnResetarStats.disabled = true;
                        }
                        
                        mostrarToast("Status resetados! Distribua os pontos e clique em Salvar.");
                    } catch(e) { console.error("Erro ao usar biscoito:", e); }
                });
            } else {
                mostrarToast("Você precisa de um Biscoito Mágico no Depósito!");
            }
        };

        // Botão de Expulsar do Clã
        document.getElementById('btnDispensar').onclick = () => {
            if (gatoSelecionado.estado === 'Doente') {
                mostrarToast("Este gato está doente! Precisa ser tratado na Enfermaria.");
                return;
            }
            
            pedirConfirmacao(`Expulsar ${gatoSelecionado.nome} do Clã é IRREVERSÍVEL. Confirmar?`, async () => {
                try {
                    // Apaga o documento do gato definitivamente do Firebase
                    const gatoRef = doc(db, "Clas", jogadorUid, "Gatos", gatoSelecionado.id);
                    await deleteDoc(gatoRef);
                    
                    mostrarToast(`${gatoSelecionado.nome} foi embora do Clã!`);
                    modalGato.style.display = 'none';
                    
                    // Recarrega o dormitório para mostrar a vaga vazia
                    carregarDormitorio(jogadorUid); 
                } catch (e) {
                    console.error("Erro ao dispensar gato:", e);
                }
            });
        };

        // ==========================================
        // NOVO SISTEMA DE SELEÇÃO DE ARTES (ESTILO DOJO)
        // ==========================================
        const modalHabilidades = document.getElementById('modalHabilidades');
        const conteudoHabilidades = document.getElementById('conteudoModalHabilidades');
        const tituloHabilidades = document.getElementById('tituloModalHabilidades');
        const btnFecharHabilidades = document.getElementById('btnFecharHabilidades');

        btnFecharHabilidades.onclick = () => { modalHabilidades.style.display = 'none'; };

        function abrirSeletorArtes(slotIndex) {
            slotAtivoIndex = slotIndex;
            tituloHabilidades.textContent = `Slot ${slotIndex + 1}: Escolha a Arte`;
            conteudoHabilidades.innerHTML = '';
            modalHabilidades.style.display = 'flex';

            if (!gatoSelecionado.peArtes) {
                gatoSelecionado.peArtes = { garate: 0, meowjitsu: 0, catpoeira: 0, felinethai: 0, ronrondo: 0 };
            }

            Object.keys(ARTES_MARCIAIS).forEach((chave) => {
                const arte = ARTES_MARCIAIS[chave];
                const pontosGato = gatoSelecionado.peArtes[chave] || 0;
                const progressoMax = 100; 

                const divArte = document.createElement('div');
                divArte.className = 'arte-item-dojo';
                divArte.innerHTML = `
                    <img src="${arte.icone}" class="arte-icone-lista" alt="Ícone">
                    <div class="arte-info-wrapper">
                        <h4>${arte.nome}</h4>
                        <div class="arte-progresso-bg">
                            <div class="arte-progresso-fill" style="width: ${(pontosGato/progressoMax)*100}%; background-color: ${arte.cor};"></div>
                            <span class="arte-texto-pe">PE: ${pontosGato}/${progressoMax}</span>
                        </div>
                    </div>
                `;
                
                divArte.onclick = () => mostrarTecnicasDaArte(chave, arte);
                conteudoHabilidades.appendChild(divArte);
            });
        }

        function mostrarTecnicasDaArte(chaveArte, arte) {
            tituloHabilidades.textContent = `Técnicas de ${arte.nome}`;
            conteudoHabilidades.innerHTML = '';

            const pontosGato = gatoSelecionado.peArtes[chaveArte] || 0;

            arte.tecnicas.forEach((tec) => {
                const liberada = pontosGato >= tec.pe;
                const row = document.createElement('div');
                row.className = `tecnica-row ${liberada ? '' : 'bloqueada'}`;
                
                row.innerHTML = `
                    <img src="${arte.icone}" alt="Arte">
                    <div class="tecnica-info">
                        <h5>${tec.nome}</h5>
                        <p>${tec.desc}</p>
                    </div>
                    <div class="tecnica-pe" style="color: ${liberada ? '#2a2a2a' : '#555'}">
                        Req: ${tec.pe} PE
                    </div>
                `;

                if (liberada) {
                    row.onclick = () => {
                        pedirConfirmacao(`Deseja equipar "${tec.nome}" no Slot ${slotAtivoIndex + 1}?`, () => confirmarEquipamento(tec, arte));
                    };
                }
                conteudoHabilidades.appendChild(row);
            });
        }

        async function confirmarEquipamento(tecnica, arte) {
            try {
                let novasHabilidades = [...gatoSelecionado.habilidadesEquipadas];
                novasHabilidades[slotAtivoIndex] = {
                    nomeTecnica: tecnica.nome,
                    iconeArte: arte.icone,
                    corArte: arte.cor
                };

                const gatoRef = doc(db, "Clas", jogadorUid, "Gatos", gatoSelecionado.id);
                await updateDoc(gatoRef, { habilidadesEquipadas: novasHabilidades });

                gatoSelecionado.habilidadesEquipadas = novasHabilidades;
                modalHabilidades.style.display = 'none';
                abrirPainelGato(gatoSelecionado); 
                mostrarToast("Técnica equipada!");
            } catch (e) { console.error(e); }
        }

        // ==========================================
        // MOTOR DE DISTRIBUIÇÃO DE ATRIBUTOS
        // ==========================================
        function atualizarInterfaceAtributos() {
            document.getElementById('val-forca').textContent = atributosTemp.forca;
            document.getElementById('val-agi').textContent = atributosTemp.agilidade;
            document.getElementById('val-res').textContent = atributosTemp.resistencia;
            document.getElementById('val-foco').textContent = atributosTemp.foco;
            document.getElementById('ptsLivres').textContent = pontosLivresTemp;

            // Se a Resistência mudar, prevê o novo HP Máximo na tela em tempo real
            const novoHpMax = 250 + (atributosTemp.resistencia * 15);
            document.getElementById('txtHp').textContent = `${Math.round(gatoSelecionado.hpAtual)}/${novoHpMax}`;
            document.getElementById('fillHp').style.width = `${(gatoSelecionado.hpAtual / novoHpMax) * 100}%`;

            // Trava ou destrava os botões "+" se houver pontos
            document.querySelectorAll('.btn-add').forEach(btn => {
                btn.disabled = pontosLivresTemp <= 0;
            });

            // Trava ou destrava os botões "-" (só pode tirar o que acabou de colocar)
            document.querySelectorAll('.btn-sub').forEach(btn => {
                const attr = btn.getAttribute('data-attr');
                btn.disabled = atributosTemp[attr] <= atributosBase[attr];
            });
        }

        // Cliques do Botão +
        document.querySelectorAll('.btn-add').forEach(btn => {
            btn.onclick = () => {
                if (gatoSelecionado.estado === 'Doente') {
                    mostrarToast("Este gato está doente! Precisa ser tratado na Enfermaria.");
                    return;
                }
                if (pontosLivresTemp > 0) {
                    const attr = btn.getAttribute('data-attr');
                    atributosTemp[attr]++;
                    pontosLivresTemp--;
                    atualizarInterfaceAtributos();
                }
            };
        });

        // Cliques do Botão -
        document.querySelectorAll('.btn-sub').forEach(btn => {
            btn.onclick = () => {
                if (gatoSelecionado.estado === 'Doente') {
                    mostrarToast("Este gato está doente! Precisa ser tratado na Enfermaria.");
                    return;
                }
                const attr = btn.getAttribute('data-attr');
                if (atributosTemp[attr] > atributosBase[attr]) {
                    atributosTemp[attr]--;
                    pontosLivresTemp++;
                    atualizarInterfaceAtributos();
                }
            };
        });

        // Novo botão de Salvar (Grava a memória temporária no Firebase)
        document.getElementById('btnSalvarGato').onclick = async () => {
            if (gatoSelecionado.estado === 'Doente') {
                mostrarToast("Este gato está doente! Precisa ser tratado na Enfermaria.");
                return;
            }
            const novoNome = document.getElementById('modalNome').value.trim();
            if(!novoNome) { mostrarToast("O gato precisa ter um nome!"); return; }
            
            // REGRA DE VALIDAÇÃO: Impede salvar se qualquer atributo for menor que 1
            if (atributosTemp.forca < 1 || atributosTemp.agilidade < 1 || atributosTemp.resistencia < 1 || atributosTemp.foco < 1) {
                mostrarToast("Erro: Todos os atributos devem ser iguais ou maiores que 1!");
                return;
            }
            
            try {
                const novoHpMax = 250 + (atributosTemp.resistencia * 15);
                const gatoRef = doc(db, "Clas", jogadorUid, "Gatos", gatoSelecionado.id);
                
                await updateDoc(gatoRef, { 
                    nome: novoNome,
                    atributos: atributosTemp,
                    pontosLivres: pontosLivresTemp,
                    hpMax: novoHpMax
                });

                mostrarToast("Status salvos com sucesso!");
                carregarDormitorio(jogadorUid); 
                modalGato.style.display = 'none';
            } catch (e) { console.error(e); }
        };
        // Ativa PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }
    </script>
</body>
</html>
